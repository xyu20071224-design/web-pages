<!DOCTYPE html>

<title>始皇北巡 · 秦始皇骑北极熊</title>
<meta name="description" content="以纯手写 SVG 绘制的国风水墨长卷：秦制冕旒玄衣的始皇帝，仗剑执缰，骑极地白熊北巡于雪原极光之下。">
<style>
  :root{
    --ink:#05070c; --ink-2:#0b1119;
    --gold:#c9a227; --gold-2:#f0d79a;
    --cinnabar:#b3271e;
    --paper:#efe7d6; --paper-dim:#9f9784;
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",Georgia,serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh; color:#efe7d6; font-family:var(--sans);
    background:
      radial-gradient(1100px 620px at 50% -8%, #13202f 0%, rgba(19,32,47,0) 62%),
      radial-gradient(800px 500px at 50% 110%, #101c26 0%, rgba(16,28,38,0) 60%),
      linear-gradient(180deg,#05070c 0%,#080d14 52%,#05070c 100%);
    display:flex; justify-content:center; align-items:flex-start;
    padding:clamp(16px,3.4vw,46px) clamp(12px,3vw,40px) 40px;
  }
  .scroll{width:min(1200px,100%)}
  .art{
    position:relative; overflow:hidden; border-radius:3px;
    background:#05070c;
    border:1px solid rgba(201,162,39,.42);
    box-shadow:
      0 0 0 1px rgba(201,162,39,.12),
      0 34px 80px -28px rgba(0,0,0,.95),
      0 0 120px -40px rgba(120,190,210,.35);
  }
  .art::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 85% at 50% 42%, rgba(0,0,0,0) 52%, rgba(0,0,0,.46) 100%);
  }
  .art svg{display:block; width:100%; height:auto; aspect-ratio:1200/850}
  .caption{
    display:flex; flex-wrap:wrap; gap:10px 22px; align-items:baseline; justify-content:space-between;
    margin-top:16px; font-size:13.5px; line-height:1.7; color:#8f8871;
  }
  .caption .zh{font-family:var(--serif); color:#c9bfa4; font-size:14.5px; letter-spacing:.06em}
  .caption .en{font-style:italic; opacity:.85}
  .caption .tag{
    font-family:var(--serif); color:var(--cinnabar); border:1px solid rgba(179,39,30,.55);
    border-radius:2px; padding:1px 7px; font-size:12.5px; letter-spacing:.12em; opacity:.9;
  }
  .rule{height:1px; margin:20px 0 0; background:linear-gradient(90deg,rgba(201,162,39,0),rgba(201,162,39,.5),rgba(201,162,39,0))}
  @media (max-width:520px){
    .caption{font-size:12.5px}
    .caption .en{display:none}
  }
</style>
</head>
