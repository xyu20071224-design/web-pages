    'echo ', 'printf ', 'grep ', 'grep -i ', 'grep -n ', 'grep -r ', 'wc -l ',
    'sort ', 'sort -n ', 'uniq -c ', 'cut -d', 'tr ', 'sed ', 'awk ', 'find ',
    'find . -name ', 'which ', 'type ', 'xargs ', 'chmod +x ', 'chmod 755 ',
    'export ', 'env', 'alias ', 'history', 'source ', 'bash ', 'cd /tmp',
    'ls /home/xinyan', 'cat readme.txt', 'cat projects/app.log',
    'if ', 'for i in 1 2 3; do echo $i; done', 'while ', 'test ', '[ ',
    'clear', 'help', 'tree', 'seq 1 5', 'date', 'whoami',
  ];
  function complete(v) {
    if (!v) return COMPLETIONS;
    if (v.indexOf(' ') === -1) {
      const cmds = Object.keys(window.Shell.commands).sort();
      return cmds.filter((c) => c.indexOf(v) === 0).concat(COMPLETIONS.filter((c) => c.indexOf(v) === 0 && c !== v));
    }
    // 路径补全
    const sp = v.lastIndexOf(' ');
    const head = v.slice(0, sp + 1);
    const frag = v.slice(sp + 1);
    const slash = frag.lastIndexOf('/');
    const dirPart = slash === -1 ? '' : frag.slice(0, slash + 1);
    const namePart = slash === -1 ? frag : frag.slice(slash + 1);
    const absDir = shell.fs.resolve(shell.cwd, dirPart || '.');
    let names = [];
    try { names = shell.fs.list(absDir).map((e) => e.name); } catch (e) { return []; }
    return names.filter((n) => n.indexOf(namePart) === 0).map((n) => {
      let p = dirPart + n;
      try { if (shell.fs.isDir(shell.fs.resolve(shell.cwd, p))) p += '/'; } catch (e) {}
      return head + p;
    });
  }

  function printResult(r) {
    r.lines.forEach((l) => term.print({ text: l.text, cls: l.cls }));
    if (hintsOn) {
      (r.hints || []).forEach((t) => term.print({ text: '提示 · ' + t, cls: 'hint' }));
      (r.traces || []).forEach((tr) => {
        if (!tr.steps || !tr.steps.length) return;
        term.print({ text: '展开过程 · ' + tr.cmd, cls: 'trace' });
        tr.steps.forEach((st) => term.print({ text: '    ' + st.from + '   →   ' + st.to, cls: 'trace' }));
      });
    }
  }

  function execute(line, silent) {
    const cmd = String(line === undefined || line === null ? '' : line).trim();
    if (!cmd) return null;
    if (/^clear$/i.test(cmd)) { term.clear(); refresh(); return null; }
    if (!silent) term.echo(cmd);
    shell.historyList.push(cmd);
    const r = shell.run(cmd);
    printResult(r);
    refresh();
    return r;
  }

  /* ---------------- 右栏：目录树 ---------------- */
  function collectTree(dir, depth, out) {
    let entries;
    try { entries = shell.fs.list(dir); } catch (e) { return; }
    entries.sort((a, b) => {
      if ((a.type === 'dir') !== (b.type === 'dir')) return a.type === 'dir' ? -1 : 1;
      return a.name < b.name ? -1 : 1;
    });
    entries.forEach((e) => {
      const p = (dir === '/' ? '' : dir) + '/' + e.name;
      out.push({ path: p, name: e.name, type: e.type, size: e.size, isLink: e.isLink,
                 linkTarget: e.linkTarget, depth: depth });
      if (e.type === 'dir' && !collapsed[p]) collectTree(p, depth + 1, out);
    });
  }

  function renderTree() {
    const box = $('#tab-tree');
    if (!box) return;
    box.innerHTML = '';
    const wrap = h('div', 'tree');
    const rootPath = showWholeSystem ? '/' : HOME;
    const ancestors = new Set();
    if (!showWholeSystem) {
      let p = shell.cwd;
      while (p && p.length > HOME.length) { ancestors.add(p); p = p.slice(0, p.lastIndexOf('/')) || '/'; }
    }
    const rows = [];
    rows.push({ path: rootPath, name: rootPath === '/' ? '/（根目录）' : '~ (家目录)', type: 'dir', depth: 0, size: 0 });
    if (!collapsed[rootPath]) collectTree(rootPath, 1, rows);

    rows.forEach((r) => {
      const isCur = r.path === shell.cwd;
      const row = h('div', 'row' + (r.type === 'dir' ? ' dir' : '') + (isCur ? ' cur' : '') +
        (ancestors.has(r.path) ? ' anc' : ''));
      row.style.paddingLeft = (r.depth * 14 + 4) + 'px';
      if (r.type === 'dir' && r.depth > 0) {
        const tw = h('span', 'tw', collapsed[r.path] ? '▸' : '▾');
        tw.addEventListener('click', (ev) => {
          ev.stopPropagation();
          collapsed[r.path] = !collapsed[r.path];
          renderTree();
        });
        row.appendChild(tw);
      } else {
        row.appendChild(h('span', 'tw', ''));
      }
      row.appendChild(h('span', 'ico', r.type === 'dir' ? '📁' : (r.isLink ? '🔗' : '·')));
      row.appendChild(h('span', 'nm', r.name + (r.isLink && r.linkTarget ? ' → ' + r.linkTarget : '')));
      if (r.type !== 'dir') row.appendChild(h('span', 'sz', String(r.size) + 'B'));
      row.title = r.path + (isCur ? '　← 你现在在这里' : '　点击可 cd 过去');
      row.addEventListener('click', () => {
        if (r.type === 'dir') {
          execute('cd ' + (/\s/.test(r.path) ? JSON.stringify(r.path) : r.path));
        } else {
          execute('cat ' + (/\s/.test(r.path) ? JSON.stringify(r.path) : r.path));
        }
      });
      wrap.appendChild(row);
    });
    box.appendChild(wrap);
    box.appendChild(h('div', 'vars')).appendChild(h('div', 'note',
      '点目录 = cd 过去；点文件 = cat 看内容。蓝色是目录，🔗 是符号链接。'));
  }

  /* ---------------- 右栏：变量 ---------------- */
  function renderVars() {
    const box = $('#tab-vars');
    if (!box) return;
    box.innerHTML = '';
    const wrap = h('div', 'vars');

    const addGroup = (title, rows) => {
      if (!rows.length) return;
      wrap.appendChild(h('div', 'grp', title));
      rows.forEach((v) => {
        const r = h('div', 'vrow');
        r.appendChild(h('span', 'k', v.name + '='));
        const val = v.value.length > 60 ? v.value.slice(0, 60) + '…' : v.value;
        r.appendChild(h('span', 'val' + (v.value.length > 60 ? ' long' : ''), val || '（空）'));
        r.title = v.name + '=' + v.value + '　（点击填进输入框）';
        r.addEventListener('click', () => {
          const inp = $('#cmd');
          inp.value = 'echo $' + v.name;
          inp.focus();
        });
        wrap.appendChild(r);
      });
    };

    const isFish = shell.lang === 'fish';
    const all = shell.listVars().filter((v) => !(isFish && v.name === '?'));
    addGroup('特殊变量', isFish
      ? [{ name: 'status', value: String(shell.status) + '（上一个命令的退出码；fish 里不能用 $?）' },
         { name: 'PWD', value: shell.cwd }, { name: 'HOME', value: HOME }]
      : [{ name: '?', value: String(shell.status) + '（上一个命令的退出码）' },
         { name: 'PWD', value: shell.cwd }, { name: 'HOME', value: HOME }]);
    addGroup('已导出（子进程可见）', all.filter((v) => v.exported && ['HOME', 'PWD', 'USER', 'LOGNAME', 'SHELL', 'HOSTNAME', 'PATH', 'LANG', 'TERM'].indexOf(v.name) === -1));
    addGroup('路径与身份', all.filter((v) => ['PATH', 'SHELL', 'USER', 'HOSTNAME', 'LANG', 'TERM'].indexOf(v.name) !== -1));
    const junk = isFish ? ['PS1', '?'] : ['?'];
    addGroup('普通变量（没导出，子进程看不到）', all.filter((v) => !v.exported && junk.indexOf(v.name) === -1));
    const aliases = Object.keys(shell.aliases);
    if (aliases.length) {
      addGroup('别名', aliases.map((a) => ({ name: a, value: shell.aliases[a] })));
    }
    box.appendChild(wrap);
    box.appendChild(h('div', 'vars')).appendChild(h('div', 'note',
      'export 过的变量才会传给子进程。设一个试试：' + (shell.lang === 'fish' ? 'set -x DEMO 你好' : 'export DEMO=你好')));
  }

  /* ---------------- 右栏：数据流 ---------------- */
  function renderPipe() {
    const box = $('#tab-pipe');
    if (!box) return;
    box.innerHTML = '';
    const wrap = h('div', 'pipe');
    const stages = shell.lastPipeline || [];

    if (!stages.length) {
      wrap.appendChild(h('div', 'note',
        '这里会显示「上一次管道」的数据是怎么一段段流过去的。\n\n' +
        '先试一条：cat projects/app.log | grep ERROR | wc -l\n\n' +
        '每个命令只做一件小事，用 | 串起来就能完成复杂任务——这是 shell 最核心的思想。'));
      box.appendChild(wrap);
      return;
    }

    stages.forEach((st, i) => {
      const card = h('div', 'pipe-stage');
      const hd = h('div', 'hd');
      hd.appendChild(h('span', 'idx', String(i + 1)));
      hd.appendChild(h('span', 'cmd', st.cmd || '(复合命令)'));
      hd.appendChild(h('span', 'meta', '退出码 ' + st.status));
      card.appendChild(hd);

      const io = h('div', 'io');
      const inN = st.inLines ? st.inLines.length : 0;
      if (i > 0) {
        const first = st.inLines && st.inLines.length ? st.inLines[0] : '';
        io.appendChild(h('div', null, '')).innerHTML =
          '<span class="lbl">吃进来 </span><span class="val">' + inN + ' 行</span>' +
          (first ? '<span class="lbl">　第一行：</span>' + esc(first.slice(0, 40)) : '');
      } else {
        io.innerHTML = '<span class="lbl">吃进来 </span><span class="val">（没接管道，读的是文件或参数）</span>';
      }
      const outN = st.out ? st.out.length : 0;
      const outLine = h('div');
      outLine.innerHTML = '<span class="lbl">吐出去 </span><span class="val">' + outN + ' 行</span>' +
        (outN ? '<span class="lbl">　第一行：</span>' + esc(String(st.out[0].text).slice(0, 40)) : '');
      io.appendChild(outLine);
      if (st.err && st.err.length) {
        const e = h('div');
        e.innerHTML = '<span class="lbl">标准错误 </span><span class="st-err">' + esc(String(st.err[0].text).slice(0, 50)) + '</span>';
        io.appendChild(e);
      }
      card.appendChild(io);
      wrap.appendChild(card);
      if (i < stages.length - 1) wrap.appendChild(h('div', 'pipe-arrow', '↓'));
    });
    box.appendChild(wrap);
    const tip = h('div', 'vars');
    tip.appendChild(h('div', 'note',
      '数据只往一个方向流：上一个命令的「吐出去」变成下一个命令的「吃进来」。' +
      '最后一段的输出才会显示在终端上。'));
    box.appendChild(tip);
  }

  /* ---------------- 刷新 ---------------- */
  function refresh() {
    try { term.updatePrompt(); renderTree(); renderVars(); renderPipe(); } catch (e) { console.error(e); }
    try { if (lessonPanel) lessonPanel.evaluate(); } catch (e) { console.error(e); }
  }

  function startLesson(l) {
    currentLesson = l;
    shell = new window.Shell({ lang: l.lang || 'bash' });
    (l.prepare || []).forEach((c) => shell.run(c));
    shell.historyList = [];
    term.clear();
    setLangButtons(l.lang || 'bash');
    term.divider(l.chapter + ' · ' + l.title);
    term.print({ text: l.goal || '', cls: 'cyan' });
    term.print({ text: '' });
    if (l.intro && l.intro.length) {
      term.print({ text: '左边有讲解，右边有目录树；先读一读，再照着任务敲。', cls: 'muted' });
    }
    if (l.tasks && l.tasks.length) {
      term.print({ text: '▸ 你的第一个目标：' + l.tasks[0].text, cls: 'ok' });
      term.print({ text: '   提示：' + l.tasks[0].hint, cls: 'muted' });
    }
    term.print({ text: '' });
    if (l.prepare && l.prepare.length) {
      term.print({ text: '（本章的沙盒已经替你准备好了）', cls: 'muted' });

    if (shell.lang === lang) return;

    term.divider('已切换到 ' + lang);
    if (lang === 'fish') {
      term.print({ text: 'fish 的语法和 bash 不一样：变量用 set，命令替换用 ( )，条件用 and/or，块用 end 结束。', cls: 'muted' });
      term.print({ text: '试试：set NAME 世界   然后   echo $NAME', cls: 'muted' });
    } else {
      term.print({ text: '回到 bash 了。变量用 名字=值，命令替换用 $( )，条件用 && ||，块用 fi/done 结束。', cls: 'muted' });
    }

    term.focus();
  }

      term.playDemo(currentLesson.demo || [], (cmd) => {
        if (cmd === '__reset__') {
          shell = new window.Shell({ lang: currentLesson.lang || 'bash' });
          (currentLesson.prepare || []).forEach((c) => shell.run(c));
          term.clear();
          refresh();
          return;
        }
        execute(cmd);
      }).then(() => { running = false; });
    });
  });
  TK.qsa('#tabs button').forEach((b) => {
    b.addEventListener('click', () => {
      TK.qsa('#tabs button').forEach((x) => x.classList.toggle('on', x === b));
      ['tree', 'vars', 'pipe'].forEach((k) => {
        $('#tab-' + k).style.display = (k === b.dataset.tab) ? '' : 'none';
      });
    });
  });
  $('#hintsToggle').addEventListener('change', (e) => {
    hintsOn = e.target.checked;
    TK.toast(hintsOn ? '已打开新手解释' : '已关闭新手解释');
  });
  $('#btnWipe').addEventListener('click', () => {
    const lang = shell.lang;
    shell = new window.Shell({ lang: lang });
    term.divider('已清空沙盒（章节进度保留）');
    refresh();
    TK.toast('沙盒已清空');
  });
  $('#btnResetAll').addEventListener('click', () => {
    if (!confirm('这会清空沙盒 + 清空所有章节进度，确定吗？')) return;
    lessonPanel.progress.clear();
    lessonPanel.renderList();
    startLesson(LESSONS[0]);
    TK.toast('已全部重置');
  });

  /* 暴露给控制台调试 / 自动化测试 */
  window.ShellLearnUI = {
    get shell() { return shell; },
    execute, refresh, startLesson, switchLang, openEditor,
    get lesson() { return currentLesson; },
    get term() { return term; },
  };

  /* 开场 */
  if (LESSONS.length) {
    // 走 LessonPanel.start 而不是直接 startLesson，这样任务判分的 current 才会被设上
    lessonPanel.start(LESSONS[0], false);
  } else {
    term.print({ text: '课程数据没有加载成功。', cls: 'err' });
  }
  term.scroll();
})();

</script>
</body>
</html>
