  /* ============================================================
   * 二、词法分析
   * ============================================================ */
  const REDIR_OPS = ['&>>', '2>>', '&>', '2>', '>>', '>', '<', '<<<'];
  const OPS3 = ['&>>'];
  const OPS2 = ['2>>', '&&', '||', '>>', '&>', '2>'];
  const OPS1 = ['|', ';', '&', '>', '<', '(' , ')'];

  class LexError extends Error {}

  function isBlank(c) { return c === ' ' || c === '\t'; }
  function isName(s) { return /^[A-Za-z_][A-Za-z0-9_]*$/.test(s); }

  /**
   * 返回 token 数组：
   *   {t:'word', parts:[{k,v,q}], text:'原文'}
   *   {t:'op', v:'|'}
   * q: 0 未加引号 / 1 单引号 / 2 双引号
   */
  function lex(src, lang) {
    const toks = [];
    const s = String(src);
    let i = 0;
    const n = s.length;

    function pushWord(parts, raw) {
      if (!parts.length) return;
      toks.push({ t: 'word', parts: parts, text: raw });
    }

    while (i < n) {
      const c = s[i];
      if (isBlank(c)) { i++; continue; }
      if (c === '\n') { toks.push({ t: 'op', v: '\n' }); i++; continue; }
      if (c === '#') { while (i < n && s[i] !== '\n') i++; continue; }

      // 操作符
      if (c === '\\' && s[i + 1] === '\n') { i += 2; continue; }
      const three = s.substr(i, 3);
      if (OPS3.indexOf(three) !== -1) { toks.push({ t: 'op', v: three }); i += 3; continue; }
      const two = s.substr(i, 2);
      if (OPS2.indexOf(two) !== -1) { toks.push({ t: 'op', v: two }); i += 2; continue; }
      if (lang === 'bash' && (c === '(' || c === ')')) { toks.push({ t: 'op', v: c }); i++; continue; }
      if (OPS1.indexOf(c) !== -1 && !(lang === 'fish' && c === '(')) {
        if (c === '&' && s[i + 1] === '&') { /* 已由 two 处理 */ }
        toks.push({ t: 'op', v: c }); i++; continue;
      }

      // 普通词
      const parts = [];
      let raw = '';
      let cur = '';
      const flush = (k, q) => {
        if (cur !== '') { parts.push({ k: 'lit', v: cur, q: q }); cur = ''; }
      };
      while (i < n) {
        const ch = s[i];
        if (isBlank(ch) || ch === '\n') break;
        if (ch === '#' && raw === '' && parts.length === 0) break;
        if (lang === 'bash' && (ch === '(' || ch === ')')) break;
        if (ch === '|' || ch === ';' || ch === '&' || ch === '>' || ch === '<') break;

        if (ch === '\\') {
          const nx = s[i + 1];
          if (nx === '\n') { i += 2; continue; }
          if (nx === undefined) { raw += '\\'; cur += '\\'; i++; continue; }
          raw += '\\' + nx; cur += nx; i += 2; continue;
        }

        if (ch === "'") {
          flush('lit', 0);
          i++;
          let buf = '';
          while (i < n && s[i] !== "'") { buf += s[i]; i++; }
          if (i >= n) throw new LexError("单引号没有闭合");
          i++;
          raw += "'" + buf + "'";
          parts.push({ k: 'lit', v: buf, q: 1 });
          continue;
        }

        if (ch === '"') {
          flush('lit', 0);
          i++;
          raw += '"';
          let buf = '';
          const sub = [];
          const flushBuf = () => { if (buf !== '') { sub.push({ k: 'lit', v: buf, q: 2 }); buf = ''; } };
          while (i < n && s[i] !== '"') {
            const d = s[i];
            if (d === '\\') {
              const nx = s[i + 1];
              if (nx === '"' || nx === '\\' || nx === '$' || nx === '`') { buf += nx; raw += '\\' + nx; i += 2; continue; }
              if (nx === '\n') { i += 2; continue; }
              buf += '\\'; raw += '\\'; i++; continue;
            }
            if (d === '$' || (d === '`' && lang === 'bash')) {
              flushBuf();
              const r = readDollar(s, i, lang);
              sub.push(r.part); raw += r.raw; i = r.next;
              continue;
            }
            buf += d; raw += d; i++;
          }
          if (i >= n) throw new LexError('双引号没有闭合');
          i++; raw += '"';
          flushBuf();
          sub.forEach((p) => parts.push(p));
          continue;
        }

        if (ch === '$' || (ch === '`' && lang === 'bash')) {
          flush('lit', 0);
          const r = readDollar(s, i, lang);
          parts.push(r.part); raw += r.raw; i = r.next;
          continue;
        }

        if (lang === 'fish' && ch === '(') {
          flush('lit', 0);
          const r = readParen(s, i);
          parts.push({ k: 'cmd', v: r.inner, q: 0 }); raw += r.raw; i = r.next;
          continue;
        }

        cur += ch; raw += ch; i++;
      }
      flush('lit', 0);
      pushWord(parts, raw);
    }
    return toks;
  }

  /* 读取 $... / `...`，返回 {part, raw, next} */
  function readDollar(s, i, lang) {
    const n = s.length;
    const ch = s[i];
    if (lang === 'fish' && s[i + 1] === '?') {
      throw new LexError("$? 不是退出码。fish 里请用 $status");
    }
    if (ch === '`') {
      let j = i + 1, buf = '';
      while (j < n && s[j] !== '`') { buf += s[j]; j++; }
      if (j >= n) throw new LexError('反引号没有闭合');
      return { part: { k: 'cmd', v: buf, q: 0 }, raw: '`' + buf + '`', next: j + 1 };
    }
    const next = s[i + 1];
    if (next === '(') {
      if (s[i + 2] === '(') {
        let j = i + 3, depth = 1, buf = '';
        while (j < n) {
          if (s.substr(j, 2) === '((') { depth++; buf += '(('; j += 2; continue; }
          if (s.substr(j, 2) === '))') { depth--; if (depth === 0) break; buf += '))'; j += 2; continue; }
          buf += s[j]; j++;
        }
        return { part: { k: 'arith', v: buf, q: 0 }, raw: '$((' + buf + '))', next: j + 2 };
      }
      let j = i + 2, depth = 1, buf = '';
      while (j < n) {
        const c = s[j];
        if (c === '(') depth++;
        else if (c === ')') { depth--; if (depth === 0) break; }
        else if (c === "'") { buf += c; j++; while (j < n && s[j] !== "'") { buf += s[j]; j++; } }
        buf += c; j++;
      }
      if (j >= n) throw new LexError('$() 没有闭合');
      return { part: { k: 'cmd', v: buf, q: 0 }, raw: '$(' + buf + ')', next: j + 1 };
    }
    if (next === '{') {
      let j = i + 2, buf = '';
      while (j < n && s[j] !== '}') { buf += s[j]; j++; }
      if (j >= n) throw new LexError('${ 没有闭合');
      return { part: { k: 'var', v: buf, q: 0 }, raw: '${' + buf + '}', next: j + 1 };
    }
    if (next === undefined) return { part: { k: 'lit', v: '$', q: 0 }, raw: '$', next: i + 1 };
    if (/[A-Za-z_]/.test(next)) {
      let j = i + 1, buf = '';
      while (j < n && /[A-Za-z0-9_]/.test(s[j])) { buf += s[j]; j++; }
      return { part: { k: 'var', v: buf, q: 0 }, raw: '$' + buf, next: j };
    }
    if (/[0-9]/.test(next) || next === '?' || next === '#' || next === '@' || next === '*' ||
        next === '$' || next === '!' || next === '-') {
      return { part: { k: 'var', v: next, q: 0 }, raw: '$' + next, next: i + 2 };
    }
    return { part: { k: 'lit', v: '$', q: 0 }, raw: '$', next: i + 1 };
  }

  function readParen(s, i) {
    const n = s.length;
    let j = i + 1, depth = 1, buf = '';
    while (j < n) {
      const c = s[j];
      if (c === '(') depth++;
      else if (c === ')') { depth--; if (depth === 0) break; }
      buf += c; j++;
    }
    if (j >= n) throw new LexError('( 没有闭合');
    return { inner: buf, raw: '(' + buf + ')', next: j + 1 };
  }

  /* ============================================================
   * 三、语法分析
   * ============================================================ */
  class ParseError extends Error {}

  class Parser {
    constructor(toks, lang) { this.toks = toks; this.i = 0; this.lang = lang; }
    peek(k) { return this.toks[this.i + (k || 0)] || null; }
    next() { return this.toks[this.i++] || null; }
    eof() { return this.i >= this.toks.length; }
    isOp(t, v) { return !!t && t.t === 'op' && t.v === v; }
    isWord(t, v) { return !!t && t.t === 'word' && t.text === v && !t.parts.some((p) => p.q); }
    skipSeps() { while (!this.eof() && (this.isOp(this.peek(), ';') || this.isOp(this.peek(), '\n'))) this.next(); }
    expectWord(w) {
      const t = this.peek();
      if (!this.isWord(t, w)) throw new ParseError('语法错误：这里应该是 ' + w);
      this.next();
    }
    kw() { return this.lang === 'fish' ? FISH_KW : BASH_KW; }

    parseProgram() {
      const list = this.parseList(new Set());
      if (!this.eof()) throw new ParseError('多余的内容：' + (this.peek().text || this.peek().v));
      return list;
    }

    parseList(stops) {
      const items = [];
      for (;;) {
        this.skipSeps();
        if (this.eof()) break;
        const t = this.peek();
        // fish: `false; or echo x` —— and/or 出现在命令位置时是分隔符
        if (this.lang === 'fish' && (this.isWord(t, 'and') || this.isWord(t, 'or'))) {
          this.next();
          if (items.length) items[items.length - 1].sep = (t.text === 'and' ? '&&' : '||');
          continue;
        }
        if (t.t === 'word' && stops.has(t.text)) break;
        if (this.isOp(t, ')')) break;
        const part = this.parseAndOr(stops);
        if (!part) break;
        part.items.forEach((x) => items.push(x));
        if (this.isOp(this.peek(), '&')) { this.next(); if (items.length) items[items.length - 1].sep = '&'; }
      }
      return { t: 'list', items: items };
    }

    parseAndOr(stops) {
      const first = this.parsePipeline(stops);
      if (!first) return null;
      const items = [{ node: first, sep: ';' }];
      for (;;) {
        const t = this.peek();
        let sep = null;
        if (this.isOp(t, '&&')) sep = '&&';
        else if (this.isOp(t, '||')) sep = '||';
        else if (this.lang === 'fish' && this.isWord(t, 'and')) sep = '&&';
        else if (this.lang === 'fish' && this.isWord(t, 'or')) sep = '||';
        if (!sep) break;
        this.next();
        this.skipSeps();
        const nx = this.parsePipeline(stops);
        if (!nx) break;
        items[items.length - 1].sep = sep;
        items.push({ node: nx, sep: ';' });
      }
      return { t: 'list', items: items };
    }

    parsePipeline(stops) {
      const cmds = [this.parseCommand(stops)];
      if (!cmds[0]) return null;
      while (this.isOp(this.peek(), '|')) {
        this.next();
        this.skipSeps();
        const c = this.parseCommand(stops);
        if (!c) throw new ParseError('管道后面缺少命令');
        cmds.push(c);
      }
      return cmds.length === 1 ? cmds[0] : { t: 'pipe', cmds: cmds };
    }

    parseCommand(stops) {
      const t = this.peek();
      if (!t) return null;

      if (this.isOp(t, '(') && this.lang === 'bash') {
        this.next();
        const body = this.parseList(new Set());
        if (!this.isOp(this.peek(), ')')) throw new ParseError('( 没有对应的 )');
        this.next();
        return { t: 'subshell', body: body };
      }

      if (t.t !== 'word') return null;

      if (this.isWord(t, 'if')) return this.parseIf(stops);
      if (this.isWord(t, 'for')) return this.parseFor(stops);
      if (this.isWord(t, 'while')) return this.parseWhile(stops);
      if (this.lang === 'fish' && (this.isWord(t, 'and') || this.isWord(t, 'or'))) return null;
      // fish 3.0+ 起 ! 和 not 都能用
      if (this.lang === 'fish' && this.isWord(t, '!')) {
        this.next();
        const innerBang = this.parsePipeline(stops);
        return { t: 'not', node: innerBang };
      }
      if (this.isWord(t, 'not') && this.lang === 'fish') {
        this.next();
        const inner = this.parsePipeline(stops);
        return { t: 'not', node: inner };
      }
      if (this.isWord(t, 'function') && this.lang === 'fish') return this.parseFishFunc(stops);
      if (this.isWord(t, 'function') && this.lang === 'bash') {
        this.next();
        const nameT = this.next();
        if (!nameT || nameT.t !== 'word') throw new ParseError('function 后面要跟函数名');
        return this.parseBashFuncBody(nameT.text);
      }
      // bash: name() { ... }
      if (this.lang === 'bash' && this.isOp(this.peek(1), '(') && this.isOp(this.peek(2), ')') &&
          isName(t.text) && !stops.has(t.text)) {
        this.next(); this.next(); this.next();
        return this.parseBashFuncBody(t.text);
      }
      return this.parseSimple(stops);
    }

    parseBashFuncBody(name) {
      this.skipSeps();
      if (!this.isWord(this.peek(), '{')) throw new ParseError('函数体要用 { } 包起来');
      this.next();
      const body = this.parseList(new Set(['}']));
      this.expectWord('}');
      return { t: 'func', name: name, body: body };
    }

    parseFishFunc(stops) {
      this.next(); // function
      const nameT = this.next();
      if (!nameT || nameT.t !== 'word') throw new ParseError('function 后面要跟函数名');
      // 跳过 --description 之类的选项
      while (this.peek() && this.peek().t === 'word' && String(this.peek().text).indexOf('--') === 0) this.next();
      this.skipSeps();
      const body = this.parseList(new Set(['end']));
      this.expectWord('end');
      return { t: 'func', name: nameT.text, body: body };
    }

    parseIf(stops) {
      this.next(); // if
      const branches = [];
      for (;;) {
        const cond = this.parseAndOr(new Set(['then']));
        this.skipSeps();
        if (this.lang === 'bash') { this.expectWord('then'); this.skipSeps(); }
        else if (cond && this.isWord(this.peek(), 'then')) { this.next(); this.skipSeps(); }
        const bodyStops = this.lang === 'fish' ? new Set(['else', 'end']) : new Set(['elif', 'else', 'fi']);
        const body = this.parseList(bodyStops);
        branches.push({ cond: cond, body: body });
        if (this.isWord(this.peek(), 'elif')) { this.next(); this.skipSeps(); continue; }
        break;
      }
      let elseBody = null;
      if (this.isWord(this.peek(), 'else')) {
        this.next(); this.skipSeps();
        elseBody = this.parseList(this.lang === 'fish' ? new Set(['end']) : new Set(['fi']));
      }
      if (this.lang === 'bash') this.expectWord('fi'); else this.expectWord('end');
      return { t: 'if', branches: branches, elseBody: elseBody };
    }

    parseFor(stops) {
      this.next(); // for
      const varT = this.next();
      if (!varT || varT.t !== 'word') throw new ParseError('for 后面要跟变量名');
      const words = [];
      if (this.isWord(this.peek(), 'in')) {
        this.next();
        while (!this.eof()) {
          const t = this.peek();
          if (this.isOp(t, ';') || this.isOp(t, '\n')) break;
          if (t.t === 'word' && (t.text === 'do' || (this.lang === 'fish' && t.text === 'end'))) break;
          words.push(this.next());
        }
      }
      this.skipSeps();
      if (this.lang === 'bash') { this.expectWord('do'); this.skipSeps(); }
      const body = this.parseList(this.lang === 'fish' ? new Set(['end']) : new Set(['done']));
      if (this.lang === 'bash') this.expectWord('done'); else this.expectWord('end');
      return { t: 'for', name: varT.text, words: words, body: body };
    }

    parseWhile(stops) {
      this.next(); // while
      const cond = this.parseAndOr(new Set(['do']));
      this.skipSeps();
      if (this.lang === 'bash') { this.expectWord('do'); this.skipSeps(); }
      const body = this.parseList(this.lang === 'fish' ? new Set(['end']) : new Set(['done']));
      if (this.lang === 'bash') this.expectWord('done'); else this.expectWord('end');
      return { t: 'while', cond: cond, body: body };
    }

    parseSimple(stops) {
      const assigns = [], words = [], redirs = [];
      const kwSet = this.kw();
      while (!this.eof()) {
        const t = this.peek();
        if (t.t === 'op') {
          if (t.v === ';' || t.v === '\n' || t.v === '|' || t.v === '&&' || t.v === '||' ||
              t.v === '&' || t.v === ')') break;
          if (REDIR_OPS.indexOf(t.v) !== -1) {
            this.next();
            const target = this.next();
            if (!target) throw new ParseError('重定向后面缺少文件名');
            redirs.push({ op: t.v, target: target });
            continue;
          }
          break;
        }
        if (t.t === 'word' && stops.has(t.text)) break;
        if (this.lang === 'fish' && (this.isWord(t, 'and') || this.isWord(t, 'or'))) break;
        if (this.lang === 'bash' && BASH_END_WORDS.has(t.text) && !words.length && !assigns.length) break;

        // 赋值 FOO=bar（仅 bash，且出现在命令名之前）
        if (this.lang === 'bash' && !words.length) {
          const p0 = t.parts[0];
          if (p0 && p0.k === 'lit' && p0.q === 0) {
            const m = /^([A-Za-z_][A-Za-z0-9_]*)=([\s\S]*)$/.exec(p0.v);
            if (m) {
              this.next();
              const rest = t.parts.slice(1);
              const valParts = (m[2] !== '' ? [{ k: 'lit', v: m[2], q: 0 }] : []).concat(rest);
              assigns.push({ name: m[1], parts: valParts });
              continue;
            }
          }
        }
        words.push(this.next());
      }
      return { t: 'simple', assigns: assigns, words: words, redirs: redirs };
    }
  }

  const BASH_KW = { if: 1, then: 1, elif: 1, else: 1, fi: 1, for: 1, do: 1, done: 1, while: 1, function: 1 };
  const FISH_KW = { if: 1, else: 1, end: 1, for: 1, while: 1, function: 1, and: 1, or: 1, not: 1 };
  const BASH_END_WORDS = new Set(['then', 'fi', 'elif', 'else', 'do', 'done', '}']);

  /* ============================================================
   * 四、IO
   * ============================================================ */
  class IO {
    constructor(stdin) { this.in = stdin || ''; this._e = []; this.hints = []; }
    _push(stream, text, cls) {
      const str = String(text === undefined ? '' : text).replace(/\n$/, '');
      str.split('\n').forEach((line) => { this._e.push({ stream: stream, text: line, cls: cls }); });
    }
    o(text, cls) { this._push('out', text, cls); }
    e(text, cls) { this._push('err', text, cls); }
    get out() { return this._e.filter((x) => x.stream === 'out'); }
    get err() { return this._e.filter((x) => x.stream === 'err'); }
    get entries() { return this._e; }
    text(streams) { return this._e.filter((x) => streams.indexOf(x.stream) !== -1).map((x) => x.text).join('\n'); }
    dropStreams(streams) { this._e = this._e.filter((x) => streams.indexOf(x.stream) === -1); }
    hint(t) { this.hints.push(t); }
  }

  /* ============================================================
   * 五、Shell
   * ============================================================ */
  const MAX_STEPS = 40000;

  class Shell {
    constructor(opts) {
      opts = opts || {};
      this.fs = opts.fs || seedFS();
      this.lang = opts.lang || 'bash';
      this.cwd = opts.cwd || HOME;
      this.vars = Object.create(null);   // name -> {v:string, list:[]|null, exp:bool}
      this.funcs = Object.create(null);
      this.aliases = Object.create(null);
      this.status = 0;
      this.positional = [];
      this.steps = 0;
      this.lastPipeline = [];
      this.traces = [];
      this.hintsOn = true;
      this.historyList = [];
      this.resetFlags();
      this.initVars();
    }

    resetFlags() {
      this.usedCommands = Object.create(null);
      this.flags = Object.create(null);
      this.visitedDirs = Object.create(null);
      this.visitedDirs[this.cwd] = true;
    }

    initVars() {
      const set = (k, v, exp) => { this.vars[k] = { v: v, list: null, exp: !!exp }; };
      set('HOME', HOME, true);
      set('USER', USER, true);
      set('LOGNAME', USER, true);
      set('SHELL', this.lang === 'fish' ? '/usr/bin/fish' : '/bin/bash', true);
      set('HOSTNAME', HOST, true);
      set('PATH', '/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin', true);
      set('PWD', this.cwd, true);
      set('LANG', 'zh_CN.UTF-8', true);
      set('TERM', 'xterm-256color', true);
      set('EDITOR', 'vim', false);
      set('PS1', '\\u@\\h:\\w\\$ ', false);
      this.vars['?'] = { v: '0', list: null, exp: false };
    }

    /* ---- 语言切换：保留文件系统与变量，换一套语法 ---- */
    setLang(lang) {
      this.lang = lang;
      this.vars.SHELL = { v: lang === 'fish' ? '/usr/bin/fish' : '/bin/bash', list: null, exp: true };
    }

    /* ---- 变量 ---- */
    getVar(name) {
      if (name === '?') return { v: String(this.status), list: null };
      if (name === '$') return { v: String(1000 + (this.steps % 100)), list: null };
      if (name === '#') return { v: String(this.positional.length), list: null };
      if (name === '0') return { v: this.lang === 'fish' ? 'fish' : 'bash', list: null };
      if (/^[1-9]$/.test(name)) return { v: this.positional[Number(name) - 1] || '', list: null };
      if (name === '@' || name === '*') return { v: this.positional.join(' '), list: this.positional.slice() };
      if (name === 'PWD') return { v: this.cwd, list: null };
      if (name === 'status' && this.lang === 'fish') return { v: String(this.status), list: null };
      if (name === 'argv' && this.lang === 'fish') return { v: this.positional.join(' '), list: this.positional.slice() };
      if (name === 'HOME') return { v: HOME, list: null };
      if (name === 'USER') return { v: USER, list: null };
      const got = this.vars[name];
      if (got) return { v: got.v, list: got.list };
      return { v: '', list: null };
    }
    setVar(name, value, exp, list) {
      const prev = this.vars[name];
      this.vars[name] = { v: value, list: list || null, exp: exp === undefined ? (prev ? prev.exp : false) : !!exp };
    }
    exportVar(name, value, list) { this.vars[name] = { v: value, list: list || null, exp: true }; }
    unsetVar(name) { delete this.vars[name]; }
    listVars(kind) {
      const out = [];
      Object.keys(this.vars).sort().forEach((k) => {
        const v = this.vars[k];
        if (kind === 'env' && !v.exp) return;
        if (kind === 'shell' && v.exp) return;
        out.push({ name: k, value: v.list ? v.list.join(' ') : v.v, exported: v.exp });
      });
      return out;
    }

    /* ---- 提示符 ---- */
    shortPath(p) {
      if (p === HOME) return '~';
      if (p.indexOf(HOME + '/') === 0) return '~' + p.slice(HOME.length);
      return p;
    }
    prompt() {
      const p = this.shortPath(this.cwd);
      if (this.lang === 'fish') {
        return '<span class="u">' + USER + '@' + HOST + '</span> <span class="p">' + p + '</span><span class="s">❯</span> ';
      }
      const root = USER === 'root' ? '#' : '$';
      return '<span class="u">' + USER + '@' + HOST + '</span>:<span class="p">' + p + '</span><span class="s">' + root + '</span> ';
    }

    /* ============================================================
     * 展开
     * ============================================================ */
    expandParts(parts, io) {
      let out = '';
      parts.forEach((p) => {
        if (p.k === 'lit') { out += p.v; return; }
        if (p.k === 'var') {
          const g = this.getVar(p.v);
          const joiner = (g.list && g.list.length) ? ' ' : '';
          out += g.list ? g.list.join(' ') : g.v;
          if (joiner === '' && g.list && !g.list.length) out += '';
          return;
        }
        if (p.k === 'cmd') {
          out += this.commandSubst(p.v);
          return;
        }
        if (p.k === 'arith') { out += String(this.arith(p.v)); return; }
      });
      return out;
    }

    /** 把一个词展开成 0..n 个字符串 */
    expandWord(word, opts) {
      opts = opts || {};
      const quotedAny = word.parts.some((p) => p.q === 1 || p.q === 2);
      const allLit = word.parts.every((p) => p.k === 'lit');

      // 1) 花括号展开（只在整词都是字面量时做，属于简化）
      let rawValues;
      if (allLit && !quotedAny) {
        const be = braceExpand(word.parts.map((p) => p.v).join(''), this.lang);
        rawValues = be || [word.parts.map((p) => p.v).join('')];
      } else {
        rawValues = [null];
      }

      let results = [];
      rawValues.forEach((fixed) => {
        let val = fixed !== null ? fixed : this.expandParts(word.parts, opts.io);
        if (!quotedAny && opts.split !== false) {
          results = results.concat(val.split(/\s+/).filter((x) => x !== ''));
        } else {
          results.push(val);
        }
      });

      // 2) 通配符
      if (!quotedAny && opts.glob !== false) {
        const expanded = [];
        results.forEach((r) => {
          if (/[*?\[]/.test(r)) {
            const m = this.glob(r);
            if (m.length) { expanded.push.apply(expanded, m); return; }
          }
          expanded.push(r);
        });
        results = expanded;
      }
      return results;
    }

    expandWordOne(word, io) {
      const r = this.expandWord(word, { split: false, glob: false, io: io });
      return r.length ? r[0] : '';
    }

    glob(pattern) {
      // 找到第一个含通配符的段，从那里开始遍历
      const isAbs = pattern.indexOf('/') === 0;
      const segs = pattern.split('/').filter((x, i) => !(i === 0 && x === ''));
      let base, start;
      if (isAbs) { base = '/'; start = 0; }
      else {
        // 相对路径：支持 ./ 与 ../
        base = this.cwd; start = 0;
      }
      const results = [];
      const walk = (dirAbs, idx) => {
        if (idx >= segs.length) { results.push(dirAbs); return; }
        const seg = segs[idx];
        if (seg === '.') return walk(dirAbs, idx + 1);
        if (seg === '..') return walk(this.fs.resolve(dirAbs, '..'), idx + 1);
        if (!/[*?\[]/.test(seg)) {
          let abs = (dirAbs === '/' ? '' : dirAbs) + '/' + seg;
          abs = this.fs.resolve('/', abs);
          if (this.fs.isLink(abs)) { try { abs = this.fs.resolve('/', this.fs.stat(abs) === null ? abs : (this.fs._lookup(abs, false).content)); } catch (e) {} }
          if (this.fs.exists(abs)) walk(abs, idx + 1);
          return;
        }
        let names;
        try { names = this.fs.list(dirAbs).map((e) => e.name); } catch (e) { return; }
        const re = globToRe(seg);
        names.forEach((nm) => {
          if (nm.charAt(0) === '.' && seg.charAt(0) !== '.') return;
          if (re.test(nm)) walk((dirAbs === '/' ? '' : dirAbs) + '/' + nm, idx + 1);
        });
      };
      walk(base, start);
      let out = results;
      if (!isAbs) {
        out = results.map((r) => {
          if (r === this.cwd) return '.';
          if (r.indexOf(this.cwd + '/') === 0) {
            const rel = r.slice(this.cwd.length + 1);
            return pattern.indexOf('./') === 0 ? './' + rel : rel;
          }
          return r;
        });
      }
      return out.sort();
    }

    /* ---- 命令替换 ---- */
    commandSubst(src) {
      const sub = new Shell({ fs: this.fs, lang: this.lang, cwd: this.cwd });
      sub.vars = Object.assign(Object.create(null), this.vars);
      sub.funcs = Object.assign(Object.create(null), this.funcs);
      sub.aliases = Object.assign(Object.create(null), this.aliases);
      sub.positional = this.positional.slice();
      sub.status = this.status;
      sub.hush = true;
      let text = '';
      try { text = sub.runCapture(src); } catch (e) { text = ''; }
      this.steps += sub.steps;
      return text.replace(/\n+$/, '');
    }

    runCapture(src) {
      const toks = lex(src, this.lang);
      const ast = new Parser(toks, this.lang).parseProgram();
      const io = new IO('');
      this.execNode(ast, io);
      return io.text(['out']);
    }

    /* ---- 算术 ---- */
    _numOf(name) {
      const g = this.getVar(name);
      const n = parseInt(g.v, 10);
      return String(isNaN(n) ? 0 : n);
    }
    arith(expr) {
      let src = String(expr);
      src = src.replace(/\$\{([A-Za-z_][A-Za-z0-9_]*)\}/g, (m, n) => this._numOf(n));
      src = src.replace(/\$([A-Za-z_][A-Za-z0-9_]*|\?|#|\$)/g, (m, n) => this._numOf(n));
      src = src.replace(/[A-Za-z_][A-Za-z0-9_]*/g, (m) => this._numOf(m));
      if (!/^[-+*/%()<>=!&|^~?:0-9\s.]*$/.test(src)) return 0;
      try {
        const val = Function('"use strict";return (' + src + ');')();
        return (typeof val === 'number' && isFinite(val)) ? Math.trunc(val) : 0;
      } catch (e) { return 0; }
    }

    /* ============================================================
     * 执行
     * ============================================================ */
    run(src) {
      const res = { lines: [], hints: [], status: 0, ok: true };
      this.traces = [];
      this.lastPipeline = [];
      const text = String(src === undefined || src === null ? '' : src);
      if (!text.trim()) { res.status = this.status; return res; }

      let ast;
      try {
        const toks = lex(text, this.lang);
        ast = new Parser(toks, this.lang).parseProgram();
      } catch (e) {
        res.lines = [{ stream: 'err', text: (this.lang === 'fish' ? 'fish: ' : 'bash: ') + '语法错误：' + e.message, cls: 'err' }];
        res.status = 2; res.ok = false;
        this.status = 2;
        return res;
      }
      const io = new IO('');
      try {
        this.status = this.execNode(ast, io);
      } catch (e) {
        if (e && e.__exit !== undefined) {
          this.status = e.__exit;
        } else if (e && e.__budget) {
          io.e('错误：命令执行次数超过上限（' + MAX_STEPS + '），可能是死循环，已中断。');
          this.status = 1;
        } else {
          io.e('内部错误：' + (e && e.message));
          this.status = 1;
        }
      }
      res.lines = io.entries;
      res.hints = io.hints;
      res.status = this.status;
      res.ok = this.status === 0;
      res.traces = this.traces;
      res.pipeline = this.lastPipeline;
      this.vars['?'] = { v: String(this.status), list: null, exp: false };
      return res;
    }

    tick() {
      if (++this.steps > MAX_STEPS) { const e = new Error('budget'); e.__budget = true; throw e; }
    }

    execNode(node, io) {
      this.tick();
      if (!node) return 0;
      switch (node.t) {
        case 'list': return this.execList(node, io);
        case 'pipe': return this.execPipe(node, io);
        case 'simple': return this.execSimple(node, io);
        case 'if': return this.execIf(node, io);
        case 'for': return this.execFor(node, io);
        case 'while': return this.execWhile(node, io);
        case 'func': this.funcs[node.name] = node.body; return 0;
        case 'subshell': {
          const sub = new Shell({ fs: this.fs, lang: this.lang, cwd: this.cwd });
          sub.vars = Object.assign(Object.create(null), this.vars);
          sub.funcs = Object.assign(Object.create(null), this.funcs);
          sub.aliases = Object.assign(Object.create(null), this.aliases);
          sub.hush = true;
          const st = sub.execNode(node.body, io);
          this.steps += sub.steps;
          return st;
        }
        case 'not': return this.execNode(node.node, io) === 0 ? 1 : 0;
        default: return 0;
      }
    }

    execList(node, io) {
      let last = this.status;
      let run = true;
      for (let i = 0; i < node.items.length; i++) {
        const it = node.items[i];
        if (run) last = this.execNode(it.node, io);
        if (it.sep === '&&') run = (last === 0);
        else if (it.sep === '||') run = (last !== 0);
        else run = true;
        this.status = last;
      }
      return last;
    }

    execPipe(node, io) {
      let stdin = '';
      const stages = [];
      const savedCwd = this.cwd;
      const savedVars = Object.assign(Object.create(null), this.vars);
      for (let i = 0; i < node.cmds.length; i++) {
        const sub = new IO(stdin);
        sub.hints = io.hints;
        const cmdText = this.describe(node.cmds[i]);
        const st = this.execSimple(node.cmds[i], sub);
        stages.push({
          cmd: cmdText,
          stdin: stdin,
          inLines: stdin === '' ? [] : stdin.replace(/\n$/, '').split('\n'),
          out: sub.out, err: sub.err, status: st,
        });
        // 只有最后一段的输出显示到终端；stderr 始终透传
        if (i === node.cmds.length - 1) {
          sub.out.forEach((x) => io._e.push(x));
        }
        sub.err.forEach((x) => io._e.push(x));
        stdin = sub.text(['out']);
        // 管道各段在子进程里跑，不影响主 shell 的状态
        this.cwd = savedCwd;
        Object.keys(this.vars).forEach((k) => { if (!(k in savedVars)) delete this.vars[k]; });
        Object.keys(savedVars).forEach((k) => { this.vars[k] = savedVars[k]; });
      }
      this.lastPipeline = stages;
      this.flags.pipe = true;
      return stages.length ? stages[stages.length - 1].status : 0;
    }

    describe(node) {
      if (!node || node.t !== 'simple') return '(复合命令)';
      return node.words.map((w) => w.text).join(' ');
    }

    execIf(node, io) {
      for (let i = 0; i < node.branches.length; i++) {
        const br = node.branches[i];
        const condIO = new IO('');
        const st = this.execNode(br.cond, condIO);
        if (st === 0) return this.execNode(br.body, io);
      }
      if (node.elseBody) return this.execNode(node.elseBody, io);
      return 0;
    }

    execFor(node, io) {
      let items;
      if (node.words.length) {
        items = [];
        node.words.forEach((w) => { items = items.concat(this.expandWord(w, { io: io })); });
      } else items = this.positional.slice();
      this.flags.loop = true;
      let last = 0;
      for (let i = 0; i < items.length; i++) {
        this.setVar(node.name, items[i], undefined, null);
        last = this.execNode(node.body, io);
        this.tick();
      }
      return last;
    }

    execWhile(node, io) {
      this.flags.loop = true;
      let last = 0;
      for (let i = 0; i < 10000; i++) {
        const condIO = new IO('');
        if (this.execNode(node.cond, condIO) !== 0) break;
        last = this.execNode(node.body, io);
        this.tick();
      }
      return last;
    }

    execSimple(node, io) {
      // 纯赋值：FOO=bar
      if (!node.words.length && node.assigns.length) {
        node.assigns.forEach((a) => {
          const v = this.expandWordOne({ parts: a.parts }, io);
          this.setVar(a.name, v);
        });
        return 0;
      }
      if (!node.words.length) return 0;

      // 展开
      const argv = [];
      const traces = [];
      node.words.forEach((w) => {
        const before = w.text;
        const values = this.expandWord(w, { io: io });
        if (values.join(' ') !== before) traces.push({ from: before, to: values.join(' ') });
        values.forEach((v) => argv.push(v));
      });
      if (traces.length) this.traces.push({ cmd: argv.join(' '), steps: traces });

      if (!argv.length) return 0;

      // 直接执行脚本：./x.sh 或 /abs/x.sh
      const name0 = argv[0];
      if (name0.indexOf('/') !== -1) {
        const abs = this.fs.resolve(this.cwd, name0);
        if (this.fs.exists(abs)) {
          if (this.fs.isDir(abs)) { io.e('bash: ' + name0 + ': Is a directory'); return 126; }
          if ((this.fs.stat(abs).mode & 0o111) === 0) {
            io.e('bash: ' + name0 + ': Permission denied');
            io.hint('脚本必须有可执行权限才能 ./ 运行：先 chmod +x ' + name0 + '；或者用 bash ' + name0 + ' 绕过。');
            return 126;
          }
          const r = this.execFile(abs, argv.slice(1));
          r.io.out.forEach((x) => io._e.push(x));
          r.io.err.forEach((x) => io._e.push(x));
          r.io.hints.forEach((h) => io.hint(h));
          this.flags.script = true;
          return r.status;
        }
      }

      // 别名
      if (this.aliases[name0] !== undefined) {
        const rest = argv.slice(1).map((a) => /\s/.test(a) ? JSON.stringify(a) : a).join(' ');
        const aliasSrc = this.aliases[name0] + (rest ? ' ' + rest : '');
        try {
          const toks = lex(aliasSrc, this.lang);
          const ast = new Parser(toks, this.lang).parseProgram();
          return this.execNode(ast, io);
        } catch (e) { /* 别名内容坏了就当解析失败 */ }
      }

      if (node.redirs.length) {
        const inSt = this.applyInputRedirs(node.redirs, io);
        if (inSt) return inSt;
      }

      // 自定义函数
      if (this.funcs[argv[0]]) {
        const savedPos = this.positional;
        this.positional = argv.slice(1);
        let fst = 0;
        try { fst = this.execNode(this.funcs[argv[0]], io); }
        finally { this.positional = savedPos; }
        this.flags.func = true;
        if (node.redirs.length) fst = this.applyOutputRedirs(node.redirs, io, fst);
        return fst;
      }

      if (this.lang === 'fish' && /^[A-Za-z_][A-Za-z0-9_]*=/.test(argv[0])) {
        const nm = argv[0].slice(0, argv[0].indexOf('='));
        io.e("fish: 不支持使用 '='。在 fish 中，请使用 'set " + nm + " " + argv[0].slice(argv[0].indexOf('=') + 1) + "'。");
        io.hint('fish 定义变量用 set，导出用 set -x；bash 那套 名字=值 在这里行不通。');
        return 127;
      }

      const cmd = Shell.commands[argv[0]];
      this.usedCommands[argv[0]] = true;
      if (!cmd) {
        io.e((this.lang === 'fish' ? 'fish' : 'bash') + ': 未找到命令：' + argv[0]);
        const guess = suggest(argv[0]);
        if (guess) io.hint('没有 ' + argv[0] + ' 这个命令。你是想用 ' + guess + ' 吗？');
        else io.hint('本模拟器只实现了课程用到的命令，输入 help 看支持哪些。');
        return 127;
      }

      let status = 0;
      try {
        status = cmd.run(this, argv, io) || 0;
      } catch (e) {
        if (e instanceof FsError) {
          io.e(argv[0] + ': ' + fsMsg(e));
          status = 1;
        } else if (e && (e.__budget || e.__exit !== undefined)) { throw e; }
        else { io.e(argv[0] + ': ' + (e && e.message ? e.message : '执行出错')); status = 1; }
      }

      // 重定向
      if (node.redirs.length) status = this.applyOutputRedirs(node.redirs, io, status);
      return status;
    }

    /** 输入重定向必须在命令执行前生效 */
    applyInputRedirs(redirs, io) {
      let status = 0;
      redirs.forEach((r) => {
        if (r.op !== '<' && r.op !== '<<<') return;
        const target = this.expandWordOne(r.target, io);
        if (r.op === '<<<') { io.in = target + '\n'; return; }
        if (target === '/dev/null') { io.in = ''; return; }
        try { io.in = this.fs.readFile(this.fs.resolve(this.cwd, target)); }
        catch (e) { io.e('bash: ' + target + ': ' + fsMsg(e)); status = 1; }
      });
      this.flags.redirect = true;
      return status;
    }

    applyOutputRedirs(redirs, io, status) {
      redirs.forEach((r) => {
        if (r.op === '<' || r.op === '<<<') return;
        const target = this.expandWordOne(r.target, io);
        const isErr = (r.op === '2>' || r.op === '2>>');
        const isBoth = (r.op === '&>' || r.op === '&>>');
        const append = (r.op === '>>' || r.op === '2>>' || r.op === '&>>');
        const streams = isBoth ? ['out', 'err'] : [isErr ? 'err' : 'out'];
        const text = io.text(streams);
        io.dropStreams(streams);
        this.flags.redirect = true;
        if (append) this.flags.append = true;
        if (target === '/dev/null') return;
        try {
          const abs = this.fs.resolve(this.cwd, target);
          this.fs.writeFile(abs, text === '' ? '' : text + '\n', append);
        } catch (e) {
          io.e('bash: ' + target + ': ' + fsMsg(e));
          status = 1;
        }
      });
      return status;
    }

    /** 执行脚本文件，返回 {io, status} */
    execFile(abs, args) {
      const content = this.fs.readFile(abs);
      const lines = content.split('\n');
      let body = content;
      let shebang = null;
      if (lines[0] && lines[0].indexOf('#!') === 0) {
        shebang = lines[0].slice(2).trim();
        body = lines.slice(1).join('\n');
      }
      const sub = new Shell({ fs: this.fs, lang: this.lang, cwd: this.cwd });
      sub.vars = Object.assign(Object.create(null), this.vars);
      sub.funcs = this.funcs;
      sub.aliases = this.aliases;
      sub.positional = args || [];
      sub.hush = true;
      sub.usedCommands = this.usedCommands;
      sub.historyList = this.historyList;
      const io = new IO('');
      let status = 0;
      try {
        const toks = lex(body, this.lang);
        const ast = new Parser(toks, this.lang).parseProgram();
        status = sub.execNode(ast, io);
      } catch (e) {
        if (e && e.__exit !== undefined) status = e.__exit;
        else io.e((this.lang === 'fish' ? 'fish' : 'bash') + ': ' + String(abs).split('/').pop() + ': ' + (e.message || 'error'));
      }
      this.steps += sub.steps;
      this.cwd = sub.cwd;
      this.flags.script = true;
      return { io: io, status: status, shebang: shebang };
    }

    /* ---- 旧接口保留 ---- */
    runScriptFile(abs, args) {
      const content = this.fs.readFile(abs);
      const lines = content.split('\n');
      let body = content;
      if (lines[0] && lines[0].indexOf('#!') === 0) body = lines.slice(1).join('\n');
      const sub = new Shell({ fs: this.fs, lang: this.lang, cwd: this.cwd });
      sub.vars = Object.assign(Object.create(null), this.vars);
      sub.funcs = this.funcs;
      sub.aliases = this.aliases;
      sub.positional = args || [];
      sub.hush = true;
      const io = new IO('');
      try {
        const toks = lex(body, this.lang);
        const ast = new Parser(toks, this.lang).parseProgram();
        sub.execNode(ast, io);
      } catch (e) {
        io.e((this.lang === 'fish' ? 'fish' : 'bash') + ': ' + String(abs).split('/').pop() + ': ' + e.message);
      }
      this.steps += sub.steps;
      return io;
    }

    /* ---- 课程校验辅助 ---- */
    used(name) { return !!this.usedCommands[name]; }
    usedAny(names) { return names.some((n) => !!this.usedCommands[n]); }
    remember(dir) { this.visitedDirs[dir] = true; }
    snapshot() {
      return {
        cwd: this.cwd,
        lang: this.lang,
        status: this.status,
        vars: this.listVars(),
        env: this.listVars('env'),
        aliases: Object.assign({}, this.aliases),
        tree: this.fs.tree(this.cwd === HOME ? HOME : this.cwd, 1, 3),
        rootTree: this.fs.tree('/', 1, 1),
        homeTree: this.fs.tree(HOME, 1, 3),
        lastPipeline: this.lastPipeline,
      };
    }
  }

  Shell.commands = Object.create(null);
  Shell.register = function (name, spec) { Shell.commands[name] = spec; };
  Shell.VFS = VFS;
  Shell.IO = IO;
  Shell.seedFS = seedFS;
  Shell.HOME = HOME;
  Shell.USER = USER;
  Shell.HOST = HOST;
  Shell.lex = lex;
  Shell.Parser = Parser;

  /* ============================================================
   * 工具函数
   * ============================================================ */
  function fsMsg(e) {
    switch (e.code) {
      case 'ENOENT': return 'No such file or directory';
      case 'EISDIR': return 'Is a directory';
      case 'ENOTDIR': return 'Not a directory';
      case 'EEXIST': return 'File exists';
      case 'ENOTEMPTY': return 'Directory not empty';
      case 'EACCES': return 'Permission denied';
      default: return 'error';
    }
  }

  function globToRe(seg) {
    let re = '^';
    for (let i = 0; i < seg.length; i++) {
      const c = seg[i];
      if (c === '*') re += '[^/]*';
      else if (c === '?') re += '[^/]';
      else if (c === '[') {
        let j = i + 1, body = '';
        if (seg[j] === '!') { body += '^'; j++; }
        while (j < seg.length && seg[j] !== ']') { body += seg[j].replace(/\\/g, '\\\\'); j++; }
        if (j >= seg.length) { re += '\\['; continue; }
        re += '[' + body + ']';
        i = j;
      } else re += c.replace(/[.+^${}()|\\\]]/g, '\\$&');
    }
    return new RegExp(re + '$');
  }

  function braceExpand(str, lang) {
    const open = str.indexOf('{');
    if (open === -1) return null;
    let depth = 0, close = -1;
    for (let i = open; i < str.length; i++) {
      if (str[i] === '{') depth++;
      else if (str[i] === '}') { depth--; if (depth === 0) { close = i; break; } }
    }
    if (close === -1) return null;
    const pre = str.slice(0, open), inner = str.slice(open + 1, close), post = str.slice(close + 1);
    let options = null;
    // fish 支持 {a,b} 但 {1..3} 不展开（和真实 fish 一致）
    const seq = (lang === 'fish') ? null : /^(-?\d+)\.\.(-?\d+)(?:\.\.(-?\d+))?$/.exec(inner);
    if (seq) {
      const a = parseInt(seq[1], 10), b = parseInt(seq[2], 10);
      const step = Math.abs(parseInt(seq[3] || '1', 10)) * (a <= b ? 1 : -1);
      options = [];
      for (let v = a; (step > 0 ? v <= b : v >= b); v += step) options.push(String(v));
    } else if (lang !== 'fish' && /^[A-Za-z]\.\.[A-Za-z]$/.test(inner)) {
      const a = inner.charCodeAt(0), b = inner.charCodeAt(4);
      options = [];
      for (let c = a; c <= b; c++) options.push(String.fromCharCode(c));
    } else if (inner.indexOf(',') !== -1) {
      options = inner.split(',');
    }
    if (!options) return null;
    let out = [];
    options.forEach((o) => {
      const sub = braceExpand(pre + o + post, lang);
      if (sub) out = out.concat(sub); else out.push(pre + o + post);
    });
    return out;
  }

  const SUGGEST = {
    sl: 'ls', l: 'ls', ll: 'ls -l', dir: 'ls', cta: 'cat', mdkir: 'mkdir', mrdir: 'rmdir',
    gerp: 'grep', grop: 'grep', ehco: 'echo', ecoh: 'echo', cdm: 'cd', griep: 'grep',
    whcih: 'which', fnd: 'find', tuch: 'touch', mvoe: 'mv', cpy: 'cp', rmove: 'rm',
  };
  function suggest(name) {
    if (SUGGEST[name]) return SUGGEST[name];
    const all = Object.keys(Shell.commands);
    let best = null, bestD = 3;
    all.forEach((c) => {
      const d = editDist(name, c);
      if (d < bestD) { bestD = d; best = c; }
    });
    return bestD <= 2 ? best : null;
  }
  function editDist(a, b) {
    const m = a.length, n = b.length;
    const dp = [];
    for (let i = 0; i <= m; i++) { dp.push([i]); }
    for (let j = 0; j <= n; j++) { dp[0][j] = j; }
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
    }
    return dp[m][n];
  }

  const api = {
    Shell: Shell, VFS: VFS, IO: IO, seedFS: seedFS, lex: lex, Parser: Parser,
    braceExpand: braceExpand, globToRe: globToRe, fsMsg: fsMsg,
    HOME: HOME, USER: USER, HOST: HOST,
  };
  global.ShellKit = api;
  global.Shell = Shell;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ============================================================
 * commands.js —— 迷你 shell 的命令实现
 * 依赖 shell.js（先加载），通过 Shell.register 注册命令。
 * ============================================================ */
(function (global) {
  'use strict';

  const Shell = global.Shell;
  const K = global.ShellKit;

  /* ---------------- 通用助手 ---------------- */
  function opts(argv, valueFlags, dashLong) {
    const o = { _: [] };
    const vf = valueFlags || {};
    const dl = dashLong || [];
    for (let i = 0; i < argv.length; i++) {
      const a = argv[i];
      if (a === '--') { for (let k = i + 1; k < argv.length; k++) o._.push(argv[k]); break; }
      if (a.length > 1 && a.slice(0, 2) === '--') {
        const body = a.slice(2);
        const eq = body.indexOf('=');
        if (eq !== -1) o[body.slice(0, eq)] = body.slice(eq + 1);
        else if (vf[body]) o[body] = argv[++i];
        else o[body] = true;
        continue;
      }
      if (a.length > 1 && a[0] === '-') {
        const body0 = a.slice(1);
        if (dl.indexOf(body0) !== -1) {
          if (vf[body0]) o[body0] = argv[++i]; else o[body0] = true;
          continue;
        }
        const chars = body0;
        for (let k = 0; k < chars.length; k++) {
          const c = chars[k];
          if (vf[c]) {
            if (k === chars.length - 1) o[c] = argv[++i];
            else { o[c] = chars.slice(k + 1); }
            break;
          }
          o[c] = true;
        }
        continue;
      }
      o._.push(a);
    }
    return o;
  }

  function modeStr(mode, type) {
    const t = type === 'dir' ? 'd' : (type === 'link' ? 'l' : '-');
    const bits = [(mode >> 6) & 7, (mode >> 3) & 7, mode & 7];
    let s = t;
    bits.forEach((b) => { s += (b & 4 ? 'r' : '-') + (b & 2 ? 'w' : '-') + (b & 1 ? 'x' : '-'); });
    return s;
  }
  function sizeStr(n, human) {
    if (!human) return String(n);
    const u = ['', 'K', 'M', 'G'];
    let i = 0, v = n;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (i === 0 ? String(v) : v.toFixed(1)) + u[i];
  }
  const MON = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
  function dateStr() {
    const d = new Date();
    return MON[d.getMonth()] + ' ' + String(d.getDate()).padStart(2, ' ') + ' ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function classify(name, type) {
    if (type === 'dir') return 'blue';
    if (type === 'link') return 'cyan';
    if (/\.(sh|bash)$/.test(name)) return 'green';
    return 'plain';
  }
  function linesOf(text) { return String(text).replace(/\n$/, '').split('\n'); }

  /* ---------------- 导航 ---------------- */
  Shell.register('pwd', {
    help: 'pwd —— 显示当前所在目录',
    run(sh, argv, io) {
      io.o(sh.cwd);
      io.hint('你现在在 ' + sh.shortPath(sh.cwd) + '。命令行里所有相对路径都是从这里算起的。');
      return 0;
    },
  });

  Shell.register('cd', {
    help: 'cd [目录] —— 切换目录；cd 回家，cd - 回上一个目录，cd .. 上一层',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      let target = o._[0];
      if (target === undefined) target = '~';
      if (target === '-') {
        if (!sh.oldpwd) { io.e('cd: OLDPWD 没有设置'); return 1; }
        const t = sh.oldpwd;
        sh.oldpwd = sh.cwd;
        sh.cwd = t;
        io.o(sh.cwd);
        return 0;
      }
      const abs = sh.fs.resolve(sh.cwd, target);
      if (!sh.fs.exists(abs)) { io.e("cd: " + target + ": No such file or directory"); return 1; }
      if (!sh.fs.isDir(abs)) { io.e("cd: " + target + ": Not a directory"); return 1; }
      sh.oldpwd = sh.cwd;
      sh.cwd = abs;
      sh.setVar('PWD', abs, true);
      sh.remember(abs);
      io.hint('目录变了：现在在 ' + sh.shortPath(abs) + '。注意提示符里的路径也跟着变了。');
      return 0;
    },
  });

  Shell.register('ls', {
    help: 'ls [-l] [-a] [-h] [路径...] —— 列出目录内容',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      const targets = o._.length ? o._ : ['.'];
      const showAll = !!(o.a || o.A);
      const long = !!o.l;
      const human = !!o.h;
      let status = 0;
      const multi = targets.length > 1;
      const out = [];

      targets.forEach((t) => {
        const abs = sh.fs.resolve(sh.cwd, t);
        let st;
        try { st = sh.fs.stat(abs); }
        catch (e) { io.e("ls: 无法访问 '" + t + "': " + K.fsMsg(e)); status = 2; return; }
        if (st.type !== 'dir') {
          out.push({ header: null, items: [{ name: t, abs: abs, entry: entryOf(sh, abs, t) }] });
          return;
        }
        let es;
        try { es = sh.fs.list(abs); } catch (e) { io.e("ls: " + t + ": " + K.fsMsg(e)); status = 2; return; }
        if (!showAll) es = es.filter((x) => x.name.charAt(0) !== '.');
        es.sort((a, b) => (a.name < b.name ? -1 : 1));
        out.push({ header: multi ? t + ':' : null, items: es.map((e) => ({ name: e.name, abs: abs + '/' + e.name, entry: e })) });
      });

      out.forEach((block) => {
        if (block.header) io.o(block.header);
        if (long) {
          io.o('total ' + block.items.length);
          block.items.forEach((it) => {
            const e = it.entry;
            const name = e.isLink ? (it.name + ' -> ' + e.linkTarget) : it.name;
            io.o(Shell.pad(modeStr(e.mode, e.type), 11) + ' 1 ' + K.USER + ' ' + K.USER + ' ' +
              Shell.pad(sizeStr(e.size, human), 6) + ' ' + dateStr() + ' ' + name, classify(it.name, e.type));
          });
        } else {
          block.items.forEach((it) => io.o(it.name, classify(it.name, it.entry.type)));
        }
      });
      io.hint(showAll ? '带 -a 时以 . 开头的隐藏文件也会列出来。' : '看不见以 . 开头的隐藏文件？加 -a：ls -a');
      sh.flags.ls = true;
      if (long) sh.flags.lsL = true;
      if (showAll) sh.flags.lsA = true;
      return status;
    },
  });

  function entryOf(sh, abs, name) {
    const st = sh.fs.stat(abs);
    return {
      name: name, type: st.type, isLink: sh.fs.isLink(abs), linkTarget: null,
      size: st.type === 'dir' ? 4096 : String(st.content).length, mode: st.mode,
    };
  }

  Shell.register('tree', {
    help: 'tree [目录] —— 用树形显示目录结构',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      const abs = sh.fs.resolve(sh.cwd, o._[0] || '.');
      if (!sh.fs.isDir(abs)) { io.e('tree: ' + (o._[0] || '.') + ': Not a directory'); return 1; }
      io.o(sh.shortPath(abs), 'blue');
      const walk = (dir, prefix, depth) => {
        if (depth > 3) return;
        let es;
        try { es = sh.fs.list(dir); } catch (e) { return; }
        es = es.filter((x) => x.name.charAt(0) !== '.').sort((a, b) => (a.name < b.name ? -1 : 1));
        es.forEach((e, i) => {
          const last = i === es.length - 1;
          io.o(prefix + (last ? '└── ' : '├── ') + e.name, classify(e.name, e.type));
          if (e.type === 'dir') walk(dir + '/' + e.name, prefix + (last ? '    ' : '│   '), depth + 1);
        });
      };
      walk(abs, '', 1);
      sh.flags.tree = true;
      return 0;
    },
  });

  /* ---------------- 文件操作 ---------------- */
  Shell.register('mkdir', {
    help: 'mkdir [-p] 目录... —— 新建目录，-p 可以一次建多层',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      if (!o._.length) { io.e('mkdir: 缺少操作数'); return 1; }
      let status = 0;
      o._.forEach((d) => {
        const abs = sh.fs.resolve(sh.cwd, d);
        try { sh.fs.mkdir(abs, !!o.p); }
        catch (e) { io.e("mkdir: 无法创建目录 '" + d + "': " + K.fsMsg(e)); status = 1; }
      });
      if (o.p) io.hint('-p 的意思是 parents：中间缺的目录会一起建出来，已存在也不报错。');
      sh.flags.mkdir = true;
      return status;
    },
  });

  Shell.register('rmdir', {
    help: 'rmdir 目录... —— 删除空目录',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      if (!o._.length) { io.e('rmdir: 缺少操作数'); return 1; }
      let status = 0;
      o._.forEach((d) => {
        const abs = sh.fs.resolve(sh.cwd, d);
        try {
          const st = sh.fs.stat(abs);
          if (st.type !== 'dir') throw { code: 'ENOTDIR' };
          sh.fs.remove(abs);
        } catch (e) { io.e("rmdir: 删除 '" + d + "' 失败: " + K.fsMsg(e || { code: '' })); status = 1; }
      });
      return status;
    },
  });

  Shell.register('touch', {
    help: 'touch 文件... —— 新建空文件（已存在则什么都不做）',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      if (!o._.length) { io.e('touch: 缺少操作数'); return 1; }
      let status = 0;
      o._.forEach((f) => {
        try { sh.fs.createFile(sh.fs.resolve(sh.cwd, f)); }
        catch (e) { io.e("touch: 无法创建 '" + f + "': " + K.fsMsg(e)); status = 1; }
      });
      sh.flags.touch = true;
      return status;
    },
  });

  Shell.register('cp', {
    help: 'cp [-r] 源 目标 —— 复制文件；目录要加 -r',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      const recursive = !!(o.r || o.R);
      if (o._.length < 2) { io.e('cp: 缺少操作数（用法：cp 源 目标）'); return 1; }
      const dstRaw = o._[o._.length - 1];
      const srcs = o._.slice(0, -1);
      let status = 0;

  Shell.register('chmod', {
    help: 'chmod 权限 文件... —— 修改权限，如 chmod +x a.sh / chmod 644 a.txt',
    run(sh, argv, io) {
      const rest = argv.slice(1);
      let i = 0;
      while (i < rest.length && (rest[i] === '-R' || rest[i] === '-v' || rest[i] === '--recursive')) i++;
      if (rest.length - i < 2) { io.e('chmod: 用法：chmod 权限 文件...'); return 1; }
      const spec = rest[i], files = rest.slice(i + 1);
      let status = 0;
      files.forEach((f) => {
        const abs = sh.fs.resolve(sh.cwd, f);
        try {
          const st = sh.fs.stat(abs);
          let mode = st.mode;
          if (/^[0-7]{3,4}$/.test(spec)) mode = parseInt(spec.slice(-3), 8);
          else {
            const m = /^([ugoa]*)([+\-=])([rwx]+)$/.exec(spec);
            if (!m) throw { code: 'EINVAL' };
            const who = m[1] || 'a';
            const add = m[2] === '+', set = m[2] === '=';
            let bits = 0;
            if (m[3].indexOf('r') !== -1) bits |= 4;
            if (m[3].indexOf('w') !== -1) bits |= 2;
            if (m[3].indexOf('x') !== -1) bits |= 1;
            const targets = [];
            if (who.indexOf('u') !== -1 || who === 'a') targets.push(6);
            if (who.indexOf('g') !== -1 || who === 'a') targets.push(3);
            if (who.indexOf('o') !== -1 || who === 'a') targets.push(0);
            targets.forEach((shift) => {
              if (set) mode = (mode & ~(7 << shift)) | (bits << shift);
              else if (add) mode |= (bits << shift);
              else mode &= ~(bits << shift);
            });
          }
          sh.fs.chmod(abs, mode);
        } catch (e) { io.e("chmod: 无法修改 '" + f + "' 的权限: " + K.fsMsg(e || { code: '' })); status = 1; }
      });
      io.hint('rwx 三组分别对应用户、同组、其他人。+x 就是「加上可执行」，脚本必须有它才能 ./ 运行。');
      sh.flags.chmod = true;
      return status;
    },
  });

    run(sh, argv, io) {

  Shell.register('grep', {
    help: 'grep [-i] [-v] [-n] [-c] [-r] [-l] 模式 [文件...] —— 按行筛选',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      const M = o.e ? 'e' : '';
      if (!o._.length && !M) { io.e('grep: 用法：grep 模式 [文件...]'); return 2; }
      const pattern = o._[0];
      const files = o._.slice(1);
      let re;
      try { re = new RegExp(pattern, o.i ? 'i' : ''); }
      catch (e) { io.e('grep: 正则写错了：' + e.message); return 2; }

      const matchLine = (line) => {
        let hit = re.test(line);
        if (o.w) hit = new RegExp('\\b' + pattern + '\\b', o.i ? 'i' : '').test(line);
        return o.v ? !hit : hit;
      };
      let status = 1, printed = 0, totalMatches = 0;

      const doText = (text, label, withLabel) => {
        const ls = linesOf(text);
        let c = 0;
        ls.forEach((l, i) => {
          if (matchLine(l)) {
            c++; totalMatches++;
            if (o.l) return;
            if (o.c) return;
            const pre = (withLabel ? label + ':' : '') + (o.n ? (i + 1) + ':' : '');
            io.o(pre + l, 'plain');
            printed++;
          }
        });
        if (o.c) io.o(String(c));
        if (o.l && c) io.o(label);
        if (c) status = 0;
        return c;
      };

      if (!files.length) { doText(io.in, '(标准输入)', false); }
      else {
        files.forEach((f) => {
          const abs = sh.fs.resolve(sh.cwd, f);
          try {
            const st = sh.fs.stat(abs);
            if (st.type === 'dir') {
              if (!o.r) { io.e('grep: ' + f + ': Is a directory'); status = 2; return; }
              const walk = (dir) => {
                sh.fs.list(dir).forEach((e) => {
                  const p = dir + '/' + e.name;
                  if (e.type === 'dir') walk(p);
                  else doText(sh.fs.readFile(p), sh.shortPath(p), true);
                });
              };
              walk(abs);
            } else doText(sh.fs.readFile(abs), f, files.length > 1);
          } catch (e) { io.e('grep: ' + f + ': ' + K.fsMsg(e)); status = 2; }
        });
      }
      sh.flags.grep = true;
      if (o.r) sh.flags.grepR = true;
      if (o.i) sh.flags.grepI = true;
      if (o.v) sh.flags.grepV = true;
      if (!o.c && !o.l) {
        io.hint(o.v ? '-v 表示「反过来」：只打印不匹配的行。' : '默认是「包含这个模式的行就打印出来」，支持正则。');
      }
      return printed === 0 && !o.c && !o.l ? 1 : status;
    },
  });

  Shell.register('tr', {
    help: 'tr 原字符 新字符 —— 字符替换，如 tr a-z A-Z',
    run(sh, argv, io) {

          return r;
        });
      };
      const from = expand(a), to = expand(b);
      let out = '';
      for (const ch of src) {
        const idx = from.indexOf(ch);
        if (idx === -1) out += ch;
        else if (!o.d) out += to[idx] !== undefined ? to[idx] : to.charAt(to.length - 1);

  Shell.register('awk', {

    run(sh, argv, io) {

      const sep = o.F === undefined ? /\s+/ : new RegExp(o.F);
      const m = /\{\s*print\s+(.+?)\s*\}/.exec(prog);

            expr = expr.trim();

  Shell.register('find', {
    help: 'find [起点] [-name 模式] [-type f|d] [-maxdepth N] —— 找文件',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), { name: true, type: true, maxdepth: true },
        ['name', 'type', 'maxdepth', 'iname', 'path']);
      const start = o._[0] || '.';
      const abs = sh.fs.resolve(sh.cwd, start);
      if (!sh.fs.exists(abs)) { io.e("find: '" + start + "': No such file or directory"); return 1; }
      const maxDepth = o.maxdepth !== undefined ? parseInt(o.maxdepth, 10) : 99;
      const nameRe = o.name ? K.globToRe(o.name) : null;
      let found = 0;
      const base = sh.fs.resolve(sh.cwd, start);
      const rel = (p) => {
        if (p === base) return start === '.' ? '.' : start;
        const r = p.slice(base.length + 1);
        return (start === '.' ? './' : (start.replace(/\/$/, '') + '/')) + r;
      };
      const walk = (dir, depth) => {
        if (depth > maxDepth) return;
        let es;
        try { es = sh.fs.list(dir); } catch (e) { return; }
        es.forEach((e) => {
          const p = dir + '/' + e.name;
          const okType = !o.type || (o.type === 'd' ? e.type === 'dir' : e.type !== 'dir');
          const okName = !nameRe || nameRe.test(e.name);
          if (okType && okName) { io.o(rel(p), e.type === 'dir' ? 'blue' : 'plain'); found++; }
          if (e.type === 'dir') walk(p, depth + 1);
        });
      };
      const st = sh.fs.stat(abs);
      if (st.type === 'dir') walk(abs, 1);
      else io.o(rel(abs));
      sh.flags.find = true;
      return 0;
    },
  });

  Shell.register('which', {
    help: 'which 命令 —— 显示命令所在路径',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      let status = 0;
      o._.forEach((c) => {
        if (Shell.commands[c]) io.o('/usr/bin/' + c);
        else if (sh.aliases[c] !== undefined) io.o(c + ': 是别名 → ' + sh.aliases[c]);
        else if (sh.funcs[c]) io.o(c + ': 是函数');
        else { io.e('which: 找不到 ' + c); status = 1; }
      });
      sh.flags.which = true;
      return status;
    },
  });

  Shell.register('type', {
    help: 'type 命令 —— 说明这个命令是什么类型',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      let status = 0;
      o._.forEach((c) => {
        if (sh.aliases[c] !== undefined) io.o(c + ' 是别名 → ' + sh.aliases[c]);
        else if (sh.funcs[c]) io.o(c + ' 是函数');
        else if (Shell.commands[c]) {
          const builtin = ['cd', 'export', 'alias', 'set', 'source', '.', 'exit', 'read', 'unset'].indexOf(c) !== -1;
          io.o(c + ' 是' + (builtin ? ' shell 内建命令' : '外部命令（/usr/bin/' + c + '）'));
        } else { io.e('type: 找不到 ' + c); status = 1; }
      });
      return status;
    },
  });

  Shell.register('xargs', {
    help: 'xargs 命令 —— 把标准输入的每一行变成命令的参数',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), { n: true, I: true });
      const cmd = o._[0];
      if (!cmd) { io.e('xargs: 用法：... | xargs 命令'); return 1; }
      const items = io.in.split('\n').map((x) => x.trim()).filter(Boolean);
      if (!items.length) return 0;
      let status = 0;
      if (o.I) {
        items.forEach((it) => {
          const args = o._.slice(1).map((a) => a.split(o.I).join(it));
          status = runSimple(sh, cmd, args, io);
        });
        return status;
      }
      const per = parseInt(o.n, 10) || items.length;
      for (let i = 0; i < items.length; i += per) {
        status = runSimple(sh, cmd, o._.slice(1).concat(items.slice(i, i + per)), io);
      }
      sh.flags.xargs = true;
      return status;
    },
  });

  function runSimple(sh, name, args, parentIO) {
    const cmd = Shell.commands[name];
    if (!cmd) { parentIO.e('xargs: ' + name + ': 未找到命令'); return 127; }
    const io = new K.IO('');
    io.hints = parentIO.hints;
    let st = 0;
    try { st = cmd.run(sh, [name].concat(args), io) || 0; }
    catch (e) { parentIO.e(name + ': ' + (e.message || 'error')); st = 1; }
    io.out.forEach((x) => parentIO._e.push(x));
    io.err.forEach((x) => parentIO._e.push(x));
    return st;
  }

  /* ---------------- shell 内建 ---------------- */
  Shell.register('export', {
    help: 'export 变量=值 —— 把变量导出成环境变量，子进程才能看到',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      if (!o._.length) { sh.listVars('env').forEach((v) => io.o('declare -x ' + v.name + '="' + v.value + '"')); return 0; }
      o._.forEach((a) => {
        const eq = a.indexOf('=');
        const name = eq === -1 ? a : a.slice(0, eq);
        const val = eq === -1 ? (sh.vars[name] ? sh.vars[name].v : '') : a.slice(eq + 1);
        sh.exportVar(name, val, null);
      });
      io.hint('导出的变量才会传给子进程（比如你运行的脚本）。没导出的变量只在当前 shell 里有。');
      sh.flags.export = true;
      return 0;
    },
  });

  Shell.register('unset', {
    help: 'unset 变量名 —— 删除变量',
    run(sh, argv, io) {
      opts(argv.slice(1), {})._.forEach((n) => sh.unsetVar(n));
      return 0;
    },
  });

  Shell.register('env', {
    help: 'env —— 列出所有环境变量',
    run(sh, argv, io) {
      sh.listVars('env').forEach((v) => io.o(v.name + '=' + v.value));
      sh.flags.env = true;
      return 0;
    },
  });

  Shell.register('set', {
    help: 'set —— bash 里列出所有变量；fish 里用 set 定义变量',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      if (sh.lang !== 'fish') {
        if (!o._.length) {
          sh.listVars().forEach((v) => io.o(v.name + '=' + v.value));
          return 0;
        }
        io.hint('bash 里定义变量不用 set，直接写：名字=值（等号两边不能有空格）。');
        return 1;
      }
      // fish
      if (!o._.length) {
        sh.listVars().forEach((v) => io.o(v.name + ' ' + v.value));
        return 0;
      }
      const erase = !!o.e;
      const exp = !!o.x;
      const global = !!o.g;
      const name = o._[0];
      if (erase) { sh.unsetVar(name); return 0; }
      const values = o._.slice(1);
      if (!values.length) { io.o(name); return 0; }
      sh.setVar(name, values.join(' '), exp || undefined, values);
      if (exp) sh.flags.export = true;
      io.hint('fish 用 set 定义变量，set -x 相当于 bash 的 export。');
      sh.flags.setVar = true;
      return 0;
    },
  });

  Shell.register('alias', {
    help: 'alias 名字=\'命令\' —— 给命令起小名；直接输入 alias 列出全部',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      if (!o._.length) {
        Object.keys(sh.aliases).forEach((k) => io.o("alias " + k + "='" + sh.aliases[k] + "'"));
        return 0;
      }
      o._.forEach((a) => {
        const eq = a.indexOf('=');
        if (eq === -1) {
          if (sh.aliases[a] !== undefined) io.o("alias " + a + "='" + sh.aliases[a] + "'");
          else { io.e('alias: ' + a + ': 没有这个别名'); }
          return;
        }
        const name = a.slice(0, eq);
        let val = a.slice(eq + 1);
        if (/^'.*'$/.test(val) || /^".*"$/.test(val)) val = val.slice(1, -1);
        sh.aliases[name] = val;
      });
      io.hint('别名只是「文字替换」，定义完就能当命令用。写进 ~/.bashrc 才能每次开终端都生效。');
      sh.flags.alias = true;
      return 0;
    },
  });

  Shell.register('unalias', {
    help: 'unalias 名字 —— 删除别名',
    run(sh, argv, io) {
      opts(argv.slice(1), {})._.forEach((n) => { delete sh.aliases[n]; });
      return 0;
    },
  });

  Shell.register('history', {
    help: 'history —— 显示你敲过的命令',
    run(sh, argv, io) {
      if (!sh.historyList.length) { io.hint('还没有历史记录。'); return 0; }
      sh.historyList.forEach((h, i) => io.o(String(i + 1).padStart(5) + '  ' + h));
      sh.flags.history = true;
      return 0;
    },
  });

  Shell.register('source', {
    help: 'source 脚本 —— 在当前 shell 里执行脚本（变量会留下来）',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      if (!o._.length) { io.e('source: 缺少文件名'); return 1; }
      const abs = sh.fs.resolve(sh.cwd, o._[0]);
      if (!sh.fs.exists(abs)) { io.e('bash: ' + o._[0] + ': No such file or directory'); return 1; }
      sh.flags.source = true;
      return sh.execSource(abs, io);
    },
  });
  Shell.register('.', Shell.commands['source']);

  Shell.register('exit', {
    help: 'exit [状态码] —— 退出当前 shell / 脚本',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      const code = o._.length ? parseInt(o._[0], 10) : sh.status;
      const e = { __exit: code };
      throw e;
    },
  });

  Shell.register('true', { help: 'true —— 什么也不做，返回成功(0)', run() { return 0; } });
  Shell.register('false', { help: 'false —— 什么也不做，返回失败(1)', run() { return 1; } });

  Shell.register('test', {
    help: 'test 表达式 / [ 表达式 ] —— 条件判断，如 [ -f 文件 ]、[ "$a" = "$b" ]',
    run(sh, argv, io) {
      let args = argv.slice(1);
      if (argv[0] === '[') {
        if (args[args.length - 1] !== ']') { io.e('[: 缺少 ]'); return 2; }
        args = args.slice(0, -1);
      }
      return evalTest(sh, args) ? 0 : 1;
    },
  });
  Shell.register('[', Shell.commands['test']);

  function evalTest(sh, a) {
    if (!a.length) return false;
    if (a[0] === '!') return !evalTest(sh, a.slice(1));
    const unary = { '-e': 'exists', '-f': 'file', '-d': 'dir', '-r': 'readable', '-w': 'writable', '-x': 'exec' };
    if (a.length === 2 && unary[a[0]]) {
      const abs = sh.fs.resolve(sh.cwd, a[1]);
      switch (unary[a[0]]) {
        case 'exists': return sh.fs.exists(abs);
        case 'file': return sh.fs.exists(abs) && !sh.fs.isDir(abs);
        case 'dir': return sh.fs.exists(abs) && sh.fs.isDir(abs);
        case 'readable': return sh.fs.exists(abs) && (sh.fs.stat(abs).mode & 0o444) !== 0;
        case 'writable': return sh.fs.exists(abs) && (sh.fs.stat(abs).mode & 0o222) !== 0;
        case 'exec': return sh.fs.exists(abs) && (sh.fs.stat(abs).mode & 0o111) !== 0;
      }
    }
    if (a.length === 2 && a[0] === '-z') return a[1] === '';
    if (a.length === 2 && a[0] === '-n') return a[1] !== '';
    if (a.length === 3) {
      const [x, op, y] = a;
      if (op === '=' || op === '==') return x === y;
      if (op === '!=') return x !== y;
      const nx = parseInt(x, 10), ny = parseInt(y, 10);
      if (op === '-eq') return nx === ny;
      if (op === '-ne') return nx !== ny;
      if (op === '-lt') return nx < ny;
      if (op === '-gt') return nx > ny;
      if (op === '-le') return nx <= ny;
      if (op === '-ge') return nx >= ny;
    }
    if (a.length === 1) return a[0] !== '';
    return false;
  }

  Shell.register('read', {
    help: 'read 变量名 —— 从标准输入读一行给变量',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      const name = o._[0] || 'REPLY';
      const line = io.in.split('\n')[0] || '';
      sh.setVar(name, line);
      io.in = io.in.split('\n').slice(1).join('\n');
      return 0;
    },
  });

  /* ---------------- 系统信息 ---------------- */
  Shell.register('date', {
    help: 'date —— 显示当前日期时间',
    run(sh, argv, io) {
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      io.o(d.getFullYear() + '年 ' + (d.getMonth() + 1) + '月 ' + d.getDate() + '日 星期' +
        '日一二三四五六'.charAt(d.getDay()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) +
        ' CST');
      return 0;
    },
  });
  Shell.register('whoami', { help: 'whoami —— 显示当前用户名', run(sh, argv, io) { io.o(K.USER); return 0; } });
  Shell.register('id', {
    help: 'id —— 显示用户和组 ID',
    run(sh, argv, io) { io.o('uid=1000(' + K.USER + ') gid=1000(' + K.USER + ') groups=1000(' + K.USER + '),27(sudo)'); return 0; },
  });
  Shell.register('uname', {
    help: 'uname [-a] —— 显示系统信息',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      if (o.a) io.o('Linux ' + K.HOST + ' 7.2.6-1-cachyos #1 SMP PREEMPT_DYNAMIC x86_64 GNU/Linux');
      else io.o('Linux');
      return 0;
    },
  });
  Shell.register('hostname', { help: 'hostname —— 显示主机名', run(sh, argv, io) { io.o(K.HOST); return 0; } });
  Shell.register('df', {
    help: 'df [-h] —— 显示磁盘占用',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      io.o('文件系统        1K-块      已用      可用 已用% 挂载点');
      io.o('/dev/nvme0n1p2 ' + (o.h ? '  468G' : '490234752') + ' ' + (o.h ? '  212G' : '222298112') +
        ' ' + (o.h ? '  233G' : '244011008') + '  48% /');
      return 0;
    },
  });
  Shell.register('du', {
    help: 'du [-h] [-s] [目录] —— 统计占用空间',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      const abs = sh.fs.resolve(sh.cwd, o._[0] || '.');
      const size = (p) => {
        let total = 0;
        const walk = (dir) => {
          let es; try { es = sh.fs.list(dir); } catch (e) { return; }
          es.forEach((e) => {
            if (e.type === 'dir') walk(dir + '/' + e.name);
            else total += e.size;
          });
        };
        walk(p);
        return total;
      };
      const n = size(abs);
      io.o((o.h ? (n / 1024).toFixed(1) + 'K' : String(Math.ceil(n / 1024))) + '\t' + (o._[0] || '.'));
      return 0;
    },
  });
  Shell.register('ps', {
    help: 'ps —— 显示进程（模拟输出）',
    run(sh, argv, io) {
      io.o('    PID TTY          TIME CMD');
      io.o('   1024 pts/0    00:00:00 bash');
      io.o('   1088 pts/0    00:00:00 ps');
      return 0;
    },
  });
  Shell.register('sleep', {
    help: 'sleep 秒数 —— 等待（模拟器里立刻返回）',
    run(sh, argv, io) {
      io.hint('模拟器里 sleep 不会真的等待，否则页面会卡住。');
      return 0;
    },
  });
  Shell.register('seq', {
    help: 'seq 起点 终点 —— 生成一串数字',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      const nums = o._.map(Number);
      let a = 1, b = 1, step = 1;
      if (nums.length === 1) { b = nums[0]; }
      else if (nums.length === 2) { a = nums[0]; b = nums[1]; }
      else if (nums.length >= 3) { a = nums[0]; step = nums[1]; b = nums[2]; }
      if (!isFinite(a) || !isFinite(b)) { io.e('seq: 参数要是数字'); return 1; }
      for (let v = a; step > 0 ? v <= b : v >= b; v += step) io.o(String(v));
      sh.flags.seq = true;
      return 0;
    },
  });
  Shell.register('tee', {
    help: 'tee [-a] 文件 —— 把输入同时写到文件和屏幕',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      const text = io.in.replace(/\n$/, '');
      if (o._.length) {
        try { sh.fs.writeFile(sh.fs.resolve(sh.cwd, o._[0]), text + '\n', !!o.a); }
        catch (e) { io.e('tee: ' + o._[0] + ': ' + K.fsMsg(e)); return 1; }
      }
      io.o(text);
      sh.flags.tee = true;
      return 0;
    },
  });
  Shell.register('clear', {
    help: 'clear —— 清屏',
    run(sh, argv, io) { io.special = 'clear'; return 0; },
  });
  Shell.register('sudo', {
    help: 'sudo 命令 —— 以管理员身份执行（模拟器里只是提示）',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      io.hint('sudo 会以 root 身份执行命令。真实系统里它要你输入自己的密码，而且别乱用。');
      sh.flags.sudo = true;
      return 0;
    },
  });

  /* 用指定解释器运行脚本：bash x.sh / sh x.sh / fish x.sh */
  ['bash', 'sh', 'fish', 'zsh', 'dash'].forEach((name) => {
    Shell.register(name, {
      help: name + ' 脚本 [参数...] —— 用这个解释器运行脚本文件',
      run(sh, argv, io) {
        const o = opts(argv.slice(1), {});
        const file = o._[0];
        if (!file) { io.hint('这里 ' + name + ' 只用来运行脚本，例如：' + name + ' hello.sh'); return 0; }
        const abs = sh.fs.resolve(sh.cwd, file);
        if (!sh.fs.exists(abs)) { io.e(name + ': ' + file + ': No such file or directory'); return 127; }
        const r = sh.execFile(abs, o._.slice(1));
        r.io.out.forEach((x) => io._e.push(x));
        r.io.err.forEach((x) => io._e.push(x));
        r.io.hints.forEach((h) => io.hint(h));
        return r.status;
      },
    });
  });

  Shell.register('man', {
    help: 'man 命令 —— 查看用法',
    run(sh, argv, io) {
      const o = opts(argv.slice(1), {});
      const c = o._[0];
      if (!c) { io.e('man: 要看哪个命令？例如 man ls'); return 1; }
      const spec = Shell.commands[c];
      if (!spec) { io.e('没有 ' + c + ' 的手册页'); return 1; }
      io.o(c.toUpperCase() + '(1)', 'bold');
      io.o('');
      io.o('名称', 'bold');
      io.o('    ' + c + ' —— ' + (spec.help || '').replace(/^[^—]*——\s*/, ''));
      io.o('');
      io.o('说明', 'bold');
      io.o('    这是本模拟器内置的帮助，不是真实 man 手册。');
      return 0;
    },
  });

  Shell.register('help', {
    help: 'help —— 列出本模拟器支持的所有命令',
    run(sh, argv, io) {
      io.o('本模拟器支持的命令：', 'bold');
      io.o('');
      const names = Object.keys(Shell.commands).sort();
      names.forEach((n) => {
        if (!Shell.commands[n].help) return;
        io.o('  ' + Shell.pad(n, 10) + Shell.commands[n].help.replace(/^[^—]*——\s*/, ''), 'plain');
      });
      io.o('');
      io.o('另外还支持：管道 | 、重定向 > >> < 2> &> 、通配符 * ? [] {} 、变量 $VAR 、', 'muted');
      io.o('命令替换 $(...) 、逻辑 && || 、流程控制 if/for/while 、脚本 ./x.sh 、函数。', 'muted');
      return 0;
    },
  });

  /* 文本对齐助手（按显示宽度补空格） */
  Shell.pad = function (s, n) {
    s = String(s);
    let w = 0;
    for (const ch of s) w += /[\u2E80-\uA4CF\uFF00-\uFF60]/.test(ch) ? 2 : 1;
    return s + ' '.repeat(Math.max(0, n - w));
  };

  /* source 的实现挂在 Shell 原型上（需要访问 Parser） */
  Shell.prototype.execSource = function (abs, io) {
    const content = this.fs.readFile(abs);
    const sub = new Shell({ fs: this.fs, lang: this.lang, cwd: this.cwd });
    sub.vars = this.vars;
    sub.funcs = this.funcs;
    sub.aliases = this.aliases;
    sub.positional = this.positional.slice();
    sub.hush = true;
    sub.historyList = this.historyList;
    sub.usedCommands = this.usedCommands;
    try {
      const toks = K.lex(content, this.lang);
      const ast = new K.Parser(toks, this.lang).parseProgram();
      const st = sub.execNode(ast, io);
      this.cwd = sub.cwd;
      this.steps += sub.steps;
      return st;
    } catch (e) {
      io.e('source: ' + e.message);
      return 1;
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ============================================================
 * lessons.js —— 命令行学习网页的课程数据
 * 18 章 / 4 个部分。导出全局 LESSONS，同时支持 node 里 require。
 * 每个任务用 check(e) 校验，e 是 Shell 实例（或 ui.js 里的 engine 代理）。
 * ============================================================ */
(function (global) {
  'use strict';

  /* ---------------- 判分用的小助手（都要防炸） ---------------- */
  function ok(e, p) { try { return !!e.fs.exists(p); } catch (err) { return false; } }
  function txt(e, p) { try { return String(e.fs.readFile(p)); } catch (err) { return ''; } }
  function has(e, p, s) { return txt(e, p).indexOf(s) !== -1; }
  function mode(e, p) { try { return e.fs.stat(p).mode; } catch (err) { return 0; } }
  function lines(e, p) {
    const t = txt(e, p);
    if (t === '') return 0;
    return t.replace(/\n$/, '').split('\n').length;
  }
  function varIs(e, name, value) {
    const v = e.vars && e.vars[name];
    return !!v && v.v === value;
  }
  function exported(e, name) {
    const v = e.vars && e.vars[name];
    return !!v && !!v.exp;
  }

  const LESSONS = [

    /* ==========================================================
     * 第一部分 · 认识终端
     * ========================================================== */
    {
      id: 'ch1',
      part: '第一部分 · 认识终端',
      chapter: '第 1 章',
