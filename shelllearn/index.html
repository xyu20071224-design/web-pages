<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>命令行学习模拟器 · bash / fish 从零开始</title>
<style>
/* ============================================================
 * termkit.css —— 通用终端学习页样式内核
 * 从 git-learn/style.css 提取，去掉 git 专有部分（提交图/三区），
 * 扩充目录树 / 变量表 / 管道可视化 / 展开过程 等通用面板。
 * ============================================================ */

:root {
  --bg: #0d1117;
  --panel: #161b22;
  --panel-2: #1c2128;
  --panel-3: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --dim: #6e7681;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --blue: #58a6ff;
  --purple: #bc8cff;
  --teal: #39c5cf;
  --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, "Liberation Mono", Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Source Han Sans SC", sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 14px; line-height: 1.6;
}
button { font-family: inherit; cursor: pointer; }

/* ---------- 顶栏 ---------- */
.topbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
.brand .tag { font-size: 12px; color: var(--muted); }

.btn {
  background: var(--panel-3); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 11px; font-size: 13px; transition: .15s;
}
.btn:hover { background: #2d333b; border-color: #4b545e; }
.btn.primary { background: #1f6feb; border-color: #1f6feb; }
.btn.primary:hover { background: #388bfd; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.switch { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
.switch input { accent-color: var(--green); }

/* shell 语言切换（bash / fish） */
.seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button {
  background: var(--panel-2); color: var(--muted); border: none;
  padding: 5px 12px; font-size: 13px; font-family: var(--mono);
}
.seg button.on { background: #1f6feb; color: #fff; }

.progress-pill {
  font-size: 12px; color: var(--muted);
  border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
  background: var(--panel-2);
}

/* ---------- 布局 ---------- */
.layout {
  display: grid;
  grid-template-columns: 300px minmax(380px, 1fr) 400px;
  gap: 12px; padding: 12px;
  height: calc(100vh - 53px); align-items: stretch;
}
.panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden;
}
.panel-head {
  padding: 9px 12px; font-size: 12px; font-weight: 600; letter-spacing: .6px;
  color: var(--muted); text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  background: var(--panel-2); flex: none;
}
.panel-head .right { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; }
.panel-body { overflow: auto; padding: 10px 12px; min-height: 0; }
.panel-body::-webkit-scrollbar, .term-out::-webkit-scrollbar,
.panel-body::-webkit-scrollbar { width: 10px; height: 10px; }
.panel-body::-webkit-scrollbar-thumb, .term-out::-webkit-scrollbar-thumb { background: #30363d; border-radius: 6px; }
.panel-body::-webkit-scrollbar-track, .term-out::-webkit-scrollbar-track { background: transparent; }

/* ---------- 终端 ---------- */
.term-out {
  flex: 1; overflow: auto; padding: 12px 14px;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.65;
  white-space: pre-wrap; word-break: break-word; background: #0b0e13;
}
.term-out .line { min-height: 1.1em; }
.term-out .plain { color: var(--text); }
.term-out .err { color: var(--red); }
.term-out .ok { color: var(--green); }
.term-out .muted { color: var(--muted); }
.term-out .dim { color: var(--dim); }
.term-out .bold { color: var(--text); font-weight: 600; }
.term-out .green { color: var(--green); }
.term-out .red { color: var(--red); }
.term-out .yellow { color: var(--yellow); }
.term-out .cyan { color: var(--teal); }
.term-out .blue { color: var(--blue); }
.term-out .purple { color: var(--purple); }
.term-out .cmd { color: var(--blue); font-weight: 600; }
.term-out .hint {
  color: #b8a45a; background: #d2992212; border-left: 2px solid #d2992266;
  padding: 2px 8px; display: block; margin: 1px 0;
}
.term-out .echo { color: var(--dim); }
.term-out .divider { color: var(--dim); margin: 6px 0; }
/* 展开过程 / 管道 的折叠块 */
.term-out .trace {
  border-left: 2px solid #1f6feb66; background: #1f6feb10;
  padding: 3px 9px; margin: 2px 0; display: block;
}
.term-out .trace .k { color: var(--purple); }
.term-out .trace .v { color: var(--teal); }

.term-input-row {
  display: flex; align-items: center; gap: 8px; flex: none;
  border-top: 1px solid var(--border); padding: 8px 12px; background: var(--panel-2);
}
.term-input-row .prompt { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
.term-input-row .prompt .u { color: var(--green); }
.term-input-row .prompt .p { color: var(--blue); }
.term-input-row .prompt .s { color: var(--muted); }
.term-input-row input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-family: var(--mono); font-size: 13px; padding: 2px 0;
}
.term-input-row input::placeholder { color: #4b545e; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px; flex: none;
         border-top: 1px solid var(--border); background: var(--panel); }
.chips .chip {
  font-family: var(--mono); font-size: 11.5px;
  background: var(--panel-3); border: 1px solid var(--border); color: #c9d1d9;
  border-radius: 999px; padding: 3px 10px;
}
.chips .chip:hover { border-color: var(--blue); color: var(--blue); }

/* ---------- 课程列表 ---------- */
.lesson-item {
  display: block; width: 100%; text-align: left;
  background: transparent; border: 1px solid transparent; border-radius: 8px;
  padding: 7px 10px; margin-bottom: 3px; color: var(--text); transition: .12s;
}
.lesson-item:hover { background: var(--panel-2); }
.lesson-item.active { background: #1f6feb22; border-color: #1f6feb66; }
.lesson-item .ch { font-size: 11px; color: var(--dim); display: block; }
.lesson-item .tt { font-size: 13px; font-weight: 500; }
.lesson-item.done .tt::after { content: " ✓"; color: var(--green); }
.part-title {
  font-size: 11px; color: var(--teal); letter-spacing: .8px;
  margin: 12px 0 5px; padding-left: 2px; font-weight: 600;
}
.part-title:first-child { margin-top: 0; }

.lesson-detail { border-top: 1px solid var(--border); padding: 12px 0 0; margin-top: 10px; }
.lesson-detail h2 { font-size: 15px; margin: 0 0 2px; }
.lesson-detail .goal { font-size: 12px; color: var(--teal); margin-bottom: 8px; }
.lesson-detail p { margin: 0 0 8px; font-size: 12.5px; color: #c9d1d9; }
.lesson-detail code {
  font-family: var(--mono); font-size: 12px; background: #ffffff12;
  padding: 0 4px; border-radius: 4px; color: var(--yellow);
}
.lesson-actions { display: flex; gap: 8px; margin: 10px 0 4px; flex-wrap: wrap; }
.explain { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 10px; }
.explain-title { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .5px; margin-bottom: 6px; }

.tasks { list-style: none; margin: 8px 0 0; padding: 0; }
.tasks li {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 6px 8px; border-radius: 6px; margin-bottom: 2px;
  font-size: 13px; color: var(--muted); border: 1px solid transparent;
}
.tasks li .box { flex: none; width: 16px; text-align: center; color: var(--dim); }
.tasks li.ok { color: var(--text); background: #3fb9501a; border-color: #3fb95033; }
.tasks li.ok .box { color: var(--green); }
.tasks li .txt { flex: 1; min-width: 0; }
.tasks li .hint {
  display: block; font-family: var(--mono); font-size: 11.5px;
  color: var(--dim); margin-top: 2px; word-break: break-word;
}
.all-done {
  margin-top: 10px; padding: 8px 10px; border-radius: 8px;
  background: #3fb9501a; border: 1px solid #3fb95055; color: var(--green); font-size: 13px;
}

/* ---------- 弹窗 ---------- */
.modal {
  position: fixed; inset: 0; background: #000000b3;
  display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px;
}
.modal.open { display: flex; }
.modal-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  width: min(780px, 100%); max-height: 86vh; display: flex; flex-direction: column;
  box-shadow: 0 16px 48px #00000080;
}
.modal-card header {
  display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border);
}
.modal-card header h3 { margin: 0; font-size: 15px; }
.modal-card header .btn { margin-left: auto; }
.modal-card .content { padding: 14px 16px; overflow: auto; }
.modal-foot { display: flex; gap: 8px; margin-top: 12px; align-items: center; }

.cheat-group { margin-bottom: 14px; }
.cheat-group h4 { margin: 0 0 6px; font-size: 12px; color: var(--teal); letter-spacing: .5px; }
.cheat-row {
  display: flex; gap: 10px; align-items: baseline; padding: 4px 6px;
  border-radius: 6px; cursor: pointer; border: 1px solid transparent;
}
.cheat-row:hover { background: var(--panel-2); border-color: var(--border); }
.cheat-row code { font-family: var(--mono); font-size: 12px; color: var(--blue); flex: none; }
.cheat-row span { font-size: 12.5px; color: var(--muted); }
/* 双列对照（bash ↔ fish） */
.cheat-row.two { display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 10px; }
.cheat-row.two code.fish { color: var(--teal); }
.cheat-head { display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 10px;
  font-size: 11px; color: var(--dim); padding: 0 6px 5px; letter-spacing: .5px; }

.editor-area {
  width: 100%; min-height: 200px; resize: vertical;
  background: #0b0e13; color: var(--text); border: 1px solid var(--border); border-radius: 8px;
  font-family: var(--mono); font-size: 13px; padding: 10px; line-height: 1.6;
}
.editor-name { font-family: var(--mono); color: var(--teal); font-size: 13px; margin-bottom: 8px; }
.editor-tip { font-size: 12px; color: var(--muted); }

.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
  background: var(--panel-3); border: 1px solid var(--border); color: var(--text);
  padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0;
  transition: .25s; pointer-events: none; z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.good { border-color: #3fb95088; }

/* ---------- 响应式 ---------- */
@media (max-width: 1300px) { .layout { grid-template-columns: 260px minmax(320px, 1fr) 340px; } }
@media (max-width: 1080px) {
  html, body { height: auto; }
  .layout { grid-template-columns: 1fr; grid-auto-rows: minmax(300px, auto); height: auto; overflow: auto; }
  .panel { max-height: 68vh; }
}

</style>
<style>
/* ============================================================
 * term-panels.css —— 右栏数据面板（页签 / 目录树 / 变量 / 管道数据流）
 * 只有用到这些面板的项目才需要引入（shell-learn 用了）。
 * ============================================================ */

/* ---------- 右侧页签 ---------- */
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: var(--panel-2);
        border-bottom: 1px solid var(--border); flex: none; }
.tabs button {
  background: transparent; border: 1px solid transparent; border-bottom: none;
  color: var(--muted); font-size: 12.5px; padding: 5px 11px;
  border-radius: 7px 7px 0 0;
}
.tabs button.on { background: var(--panel); color: var(--text); border-color: var(--border); }
.tab-body { flex: 1; overflow: auto; padding: 10px 12px; min-height: 0; }

/* ---------- 目录树 ---------- */
.tree { font-family: var(--mono); font-size: 12px; line-height: 1.75; }
.tree .row { display: flex; align-items: center; gap: 6px; border-radius: 5px; padding: 0 4px; white-space: nowrap; }
.tree .row:hover { background: var(--panel-2); }
.tree .row.cur { background: #1f6feb26; box-shadow: inset 2px 0 0 var(--blue); }
.tree .row .ico { flex: none; width: 14px; text-align: center; color: var(--dim); }
.tree .row.dir .ico { color: var(--blue); }
.tree .row .nm { color: #c9d1d9; }
.tree .row.dir .nm { color: var(--blue); font-weight: 500; }
.tree .row.cur .nm { color: #fff; }
.tree .row.anc .nm { color: #d0d7de; }
.tree .row .sz { color: var(--dim); margin-left: auto; padding-left: 8px; font-size: 11px; }
.tree .row .tw { cursor: pointer; user-select: none; color: var(--dim); width: 12px; flex: none; }
.tree .kids { padding-left: 14px; }
.tree .kids.hide { display: none; }
.tree-empty { color: var(--dim); font-size: 12px; }

/* ---------- 变量表 ---------- */
.vars { font-family: var(--mono); font-size: 12px; }
.vars .grp { font-size: 11px; color: var(--teal); letter-spacing: .5px; margin: 10px 0 4px; font-weight: 600; }
.vars .grp:first-child { margin-top: 0; }
.vars .vrow { display: flex; gap: 8px; padding: 2px 4px; border-radius: 5px; }
.vars .vrow:hover { background: var(--panel-2); }
.vars .vrow .k { color: var(--purple); flex: none; }
.vars .vrow .val { color: var(--teal); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vars .vrow .val.long { color: var(--muted); }
.vars .note { color: var(--dim); font-size: 11.5px; margin-top: 8px; line-height: 1.6; }

/* ---------- 管道可视化 ---------- */
.pipe { font-family: var(--mono); font-size: 12px; }
.pipe-stage {
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel-2); padding: 7px 9px; margin-bottom: 4px;
}
.pipe-stage .hd { display: flex; align-items: center; gap: 6px; }
.pipe-stage .idx {
  flex: none; width: 17px; height: 17px; border-radius: 50%;
  background: #1f6feb; color: #fff; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
}
.pipe-stage .cmd { color: var(--blue); font-weight: 600; }
.pipe-stage .meta { color: var(--dim); font-size: 11px; margin-left: auto; }
.pipe-stage .io { margin-top: 4px; padding-left: 23px; color: var(--muted); font-size: 11.5px; }
.pipe-stage .io .lbl { color: var(--dim); }
.pipe-stage .io .val { color: var(--yellow); }
.pipe-stage .st-ok { color: var(--green); }
.pipe-stage .st-err { color: var(--red); }
.pipe-arrow { text-align: center; color: var(--dim); font-size: 11px; line-height: 1; margin: 1px 0 5px; }


</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>命令行学习模拟器</h1>
    <span class="tag">在这儿敲命令不会弄坏任何东西</span>
  </div>

  <div class="seg" title="切换要学的 shell 语法">
    <button id="langBash" class="on">bash</button>
    <button id="langFish">fish</button>
  </div>
  <span class="progress-pill" id="progressPill">进度 0 / 18 章</span>
  <label class="switch" title="每条命令后用黄色便签解释发生了什么">
    <input type="checkbox" id="hintsToggle" checked> 新手解释
  </label>
  <button class="btn" id="btnCheat">命令速查表</button>
  <button class="btn" id="btnWipe" title="清空文件系统，保留进度和操作记录">清空沙盒</button>
  <button class="btn ghost" id="btnResetAll" title="清空沙盒 + 清空所有进度">重新开始</button>
</header>

<main class="layout">

  <!-- ============ 左：章节 ============ -->
  <aside class="panel">
    <div class="panel-head">章节 <span class="right">按顺序学，也可以随便跳</span></div>
    <div class="panel-body">
      <div id="lessonList"></div>
      <div class="lesson-detail">
        <h2 id="lessonTitle"></h2>
        <div class="goal" id="lessonGoal"></div>
        <div class="lesson-actions">
          <button class="btn primary" data-demo>▶ 自动演示</button>
          <button class="btn" id="btnRestartLesson">↻ 重来本章</button>
        </div>
        <ul class="tasks" id="taskList"></ul>
        <div class="all-done" id="allDone">✓ 本章全部完成！点上面的章节列表进入下一章。</div>
        <div class="explain">
          <div class="explain-title">讲解</div>
          <div id="lessonIntro"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ============ 中：终端 ============ -->
  <section class="panel" id="terminalPanel">
    <div class="panel-head">
      终端
      <span class="right">按 / 聚焦 · ↑↓ 历史 · Tab 补全 · Ctrl+L 清屏</span>
    </div>
    <div class="term-out" id="termOut"></div>
    <div class="chips">
      <button class="chip" data-cmd="ls -la">ls -la</button>
      <button class="chip" data-cmd="cd projects">cd projects</button>
      <button class="chip" data-cmd="cat readme.txt">cat readme.txt</button>
      <button class="chip" data-cmd="grep ERROR projects/app.log">grep ERROR …</button>
      <button class="chip" data-cmd="cat projects/app.log | grep ERROR | wc -l">管道组合</button>
      <button class="chip" data-cmd="echo 你好 > /tmp/x.txt">echo &gt; 文件</button>
      <button class="chip" data-cmd="help">help</button>
    </div>
    <div class="term-input-row">
      <span class="prompt" id="prompt"></span>
      <input id="cmd" placeholder="在这里输入命令，按回车执行" autocomplete="off" spellcheck="false">
    </div>
  </section>

  <!-- ============ 右：目录树 / 变量 / 管道 ============ -->
  <aside class="panel">
    <div class="tabs" id="tabs">
      <button data-tab="tree" class="on">目录树</button>
      <button data-tab="vars">变量</button>
      <button data-tab="pipe">数据流</button>
    </div>
    <div class="tab-body">
      <div id="tab-tree"></div>
      <div id="tab-vars" style="display:none"></div>
      <div id="tab-pipe" style="display:none"></div>
    </div>
    <div class="chips" style="border-top:1px solid var(--border)">
      <button class="chip" id="btnNewFile">＋ 新建 / 编辑文件</button>
      <button class="chip" id="btnShowAll">显示整个系统</button>
    </div>
  </aside>

</main>

<!-- ============ 速查表 ============ -->
<div class="modal" id="cheatModal">
  <div class="modal-card">
    <header>
      <h3>命令速查表</h3>
      <button class="btn" id="cheatClose">关闭 (Esc)</button>
    </header>
    <div class="content" id="cheatBody"></div>
  </div>
</div>

<!-- ============ 文件编辑器 ============ -->
<div class="modal" id="editorModal">
  <div class="modal-card">
    <header>
      <h3 id="editorTitle">编辑文件</h3>
      <button class="btn" id="editorCancel">取消 (Esc)</button>
    </header>
    <div class="content">
      <div class="editor-name" id="editorName"></div>
      <input class="editor-area" id="editorNameInput" style="min-height:auto;display:none"
             placeholder="新文件名，例如 hello.sh">
      <textarea class="editor-area" id="editorArea" spellcheck="false"
                placeholder="#!/bin/bash&#10;echo 你好"></textarea>
      <div class="modal-foot">
        <button class="btn primary" id="editorSave">保存</button>
        <label class="switch"><input type="checkbox" id="editorExec"> 保存后加上执行权限 (chmod +x)</label>
        <span class="editor-tip" id="editorPath"></span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
 * termkit.js —— 终端学习页 UI 内核
 * 从 git-learn/ui.js 提取出的项目无关部分：终端输出与控制、
 * 命令历史、Tab 补全、一键演示、课程面板与任务判分、速查表、
 * 弹窗、进度存储、Toast。
 *
 * 使用方只需：准备约定的 DOM、提供一个「执行命令」的回调。
 * ============================================================ */
(function (global) {
  'use strict';

  /* ---------------- 基础工具 ---------------- */
  function qs(sel, root) { return (root || document).querySelector(sel); }
  function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function h(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* 中文字符按 2 个宽度算 */
  const WIDE = /[\u1100-\u115F\u2E80-\uA4CF\uAC00-\uD7A3\uF900-\uFAFF\uFE30-\uFE6F\uFF00-\uFF60\uFFE0-\uFFE6]/;
  function dispWidth(s) {
    let w = 0;
    for (const ch of String(s)) w += WIDE.test(ch) ? 2 : 1;
    return w;
  }
  function truncate(s, maxUnits) {
    s = String(s);
    if (dispWidth(s) <= maxUnits) return s;
    let out = '', w = 0;
    for (const ch of s) {
      const cw = WIDE.test(ch) ? 2 : 1;
      if (w + cw > maxUnits - 1) break;
      out += ch; w += cw;
    }
    return out + '…';
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  /* 把带 `反引号` 的纯文本渲染成带 <code> 的节点 */
  function richText(text) {
    const frag = document.createDocumentFragment();
    String(text).split(/(`[^`]*`)/).forEach((seg) => {
      if (/^`[^`]*`$/.test(seg)) frag.appendChild(h('code', null, seg.slice(1, -1)));
      else if (seg) frag.appendChild(document.createTextNode(seg));
    });
    return frag;
  }

  /* ---------------- Toast ---------------- */
  let toastEl = null, toastTimer = null;
  function toast(msg, good) {
    if (!toastEl) {
      toastEl = h('div', 'toast');
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.className = 'toast show' + (good ? ' good' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = 'toast'; }, 2600);
  }

  /* ---------------- 进度存储 ---------------- */
  class Progress {
    constructor(key) {
      this.key = key;
      this.data = { done: {} };
      try {
        const raw = global.localStorage.getItem(key);
        if (raw) this.data = JSON.parse(raw) || { done: {} };
      } catch (e) { /* 隐私模式下可能不可用 */ }
    }
    save() {
      try { global.localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {}
    }
    isDone(id) { return !!this.data.done[id]; }
    markDone(id) { if (!this.data.done[id]) { this.data.done[id] = true; this.save(); return true; } return false; }
    count(lessons) { return lessons.filter((l) => this.isDone(l.id)).length; }
    clear() { this.data = { done: {} }; this.save(); }
  }

  /* ---------------- 终端 ---------------- */
  class Terminal {
    /**
     * @param {object} o
     *   outEl / inputEl / promptEl : 元素或选择器
     *   onSubmit(cmd, term)        : 用户回车时调用
     *   completer(value)           : 返回候选命令数组（可选）
     *   promptHtml()               : 返回提示符 HTML（可选，动态）
     *   historyLimit               : 历史条数上限
     */
    constructor(o) {
      this.out = typeof o.outEl === 'string' ? qs(o.outEl) : o.outEl;
      this.input = typeof o.inputEl === 'string' ? qs(o.inputEl) : o.inputEl;
      this.promptEl = o.promptEl ? (typeof o.promptEl === 'string' ? qs(o.promptEl) : o.promptEl) : null;
      this.onSubmit = o.onSubmit || function () {};
      this.completer = o.completer || null;
      this.promptHtml = o.promptHtml || null;
      this.history = [];
      this.histIdx = 0;
      this.historyLimit = o.historyLimit || 200;
      this.busy = false;
      this._bind();
      this.updatePrompt();
    }

    _bind() {
      const self = this;
      this.input.addEventListener('keydown', function (e) {
        if (self.busy) { e.preventDefault(); return; }
        if (e.key === 'Enter') {
          const v = self.input.value;
          if (v.trim()) {
            self.history.push(v.trim());
            if (self.history.length > self.historyLimit) self.history.shift();
            self.histIdx = self.history.length;
          }
          self.input.value = '';
          self.onSubmit(v, self);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (!self.history.length) return;
          self.histIdx = Math.max(0, self.histIdx - 1);
          self.input.value = self.history[self.histIdx] || '';
          self._caretEnd();
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (!self.history.length) return;
          self.histIdx = Math.min(self.history.length, self.histIdx + 1);
          self.input.value = self.history[self.histIdx] || '';
          self._caretEnd();
        } else if (e.key === 'Tab') {
          e.preventDefault();
          self._complete();
        } else if (e.key === 'l' && e.ctrlKey) {
          e.preventDefault();
          self.clear();
        }
      });
    }

    _caretEnd() {
      const n = this.input.value.length;
      try { this.input.setSelectionRange(n, n); } catch (e) {}
    }

    _complete() {
      if (!this.completer) return;
      const v = this.input.value;
      if (!v) { this.printMuted(this.completer('').join('   ')); return; }
      const hits = this.completer(v);
      if (!hits || !hits.length) return;
      if (hits.length === 1) { this.input.value = hits[0]; this._caretEnd(); return; }
      let common = hits[0];
      hits.forEach((s) => {
        let i = 0;
        while (i < common.length && i < s.length && common[i] === s[i]) i++;
        common = common.slice(0, i);
      });
      if (common.length > v.length) { this.input.value = common; this._caretEnd(); }
      else this.printMuted(hits.join('   '));
    }

    setBusy(b) {
      this.busy = b;
      this.input.disabled = b;
      this.input.placeholder = b ? '演示中…' : (this._ph || '');
    }

    updatePrompt() {
      if (this.promptEl && this.promptHtml) this.promptEl.innerHTML = this.promptHtml();
    }

    /* ---- 输出 ---- */
    print(item) {
      const div = h('div', 'line');
      if (item.spans) {
        item.spans.forEach((s) => {
          const sp = h('span', s.cls || 'plain', s.text);
          div.appendChild(sp);
        });
      } else {
        div.className = 'line ' + (item.cls || 'plain');
        div.textContent = (item.text === '' || item.text === undefined) ? '\u00a0' : item.text;
      }
      this.out.appendChild(div);
      this.scroll();
      return div;
    }
    printText(text, cls) { return this.print({ text: text, cls: cls }); }
    printMuted(text) { return this.print({ text: text, cls: 'muted' }); }
    printLines(lines) { (lines || []).forEach((l) => this.print(l)); }
    /** 打印 {lines, hints} 形式的结果 */
    printResult(res, showHints) {
      this.printLines(res.lines || []);
      if (showHints && res.hints && res.hints.length) {
        res.hints.forEach((t) => this.print({ text: '提示 · ' + t, cls: 'hint' }));
      }
    }
    echo(cmd, promptHtml) {
      const div = h('div', 'line echo');
      const p = h('span', null, '');
      p.innerHTML = promptHtml || (this.promptEl ? this.promptEl.innerHTML : '') || '$ ';
      div.appendChild(p);
      div.appendChild(document.createTextNode(' ' + cmd));
      this.out.appendChild(div);
      this.scroll();
    }
    divider(text) {
      const n = Math.max(0, 46 - dispWidth(text));
      this.print({ text: '── ' + text + ' ' + '─'.repeat(n), cls: 'divider' });
    }
    clear() { this.out.innerHTML = ''; }
    scroll() { this.out.scrollTop = this.out.scrollHeight; }
    focus() { try { this.input.focus(); } catch (e) {} }

    /** 顺序执行演示命令；run(cmd) 由调用方提供，返回 Promise 或值 */
    async playDemo(cmds, run, delay) {
      if (this.busy) return;
      this.setBusy(true);
      qsa('[data-demo]').forEach((b) => { b.disabled = true; });
      this.divider('开始自动演示');
      for (const c of cmds) {
        await run(c, this);
        await sleep(delay || 700);
      }
      this.divider('演示结束，轮到你了');
      this.setBusy(false);
      qsa('[data-demo]').forEach((b) => { b.disabled = false; });
      this.focus();
    }
  }

  /* ---------------- 课程面板 ---------------- */
  /**
   * 约定的 DOM id：
   *   #lessonList #lessonTitle #lessonGoal #lessonIntro
   *   #taskList #allDone #progressPill
   */
  class LessonPanel {
    constructor(o) {
      this.lessons = o.lessons;
      this.engine = o.engine;                   // 传给 check(e)
      this.progress = new Progress(o.progressKey || 'termkit-progress');
      this.current = null;
      this.onStart = o.onStart || function () {};
      this.ids = Object.assign({
        list: '#lessonList', title: '#lessonTitle', goal: '#lessonGoal',
        intro: '#lessonIntro', tasks: '#taskList', allDone: '#allDone', pill: '#progressPill',
      }, o.ids || {});
      this.el = {};
      Object.keys(this.ids).forEach((k) => { this.el[k] = qs(this.ids[k]); });
    }

    renderList() {
      const box = this.el.list;
      if (!box) return;
      box.innerHTML = '';
      let lastPart = null;
      this.lessons.forEach((l) => {
        if (l.part && l.part !== lastPart) {
          lastPart = l.part;
          box.appendChild(h('div', 'part-title', l.part));
        }
        const b = h('button', 'lesson-item' +
          (this.current && l.id === this.current.id ? ' active' : '') +
          (this.progress.isDone(l.id) ? ' done' : ''));
        b.appendChild(h('span', 'ch', l.chapter));
        b.appendChild(h('span', 'tt', l.title));
        b.addEventListener('click', () => this.start(l, true));
        box.appendChild(b);
      });
      if (this.el.pill) {
        this.el.pill.textContent = '进度 ' + this.progress.count(this.lessons) + ' / ' + this.lessons.length + ' 章';
      }
    }

    renderDetail() {
      const l = this.current;
      if (!l) return;
      if (this.el.title) this.el.title.textContent = l.chapter + ' · ' + l.title;
      if (this.el.goal) this.el.goal.textContent = l.goal || '';
      if (this.el.intro) {
        this.el.intro.innerHTML = '';
        (l.intro || []).forEach((p) => {
          const el = document.createElement('p');
          el.appendChild(richText(p));
          this.el.intro.appendChild(el);
        });
      }
      if (this.el.tasks) {
        this.el.tasks.innerHTML = '';
        l.tasks.forEach((t, i) => {
          const li = h('li');
          li.dataset.idx = i;
          li.appendChild(h('span', 'box', '☐'));
          const wrap = h('span', 'txt');
          wrap.appendChild(richText(t.text));
          if (t.hint) wrap.appendChild(h('span', 'hint', '▸ ' + t.hint));
          li.appendChild(wrap);
          this.el.tasks.appendChild(li);
        });
      }
      if (this.el.allDone) this.el.allDone.style.display = 'none';
    }

    /** 进入某章：重置沙盒（由调用方在 onStart 里做），刷新界面 */
    start(lesson, announce) {
      this.current = lesson;
      this.onStart(lesson);
      this.renderDetail();
      this.renderList();
      this.evaluate();
      if (announce) toast('已进入：' + lesson.title);
    }

    /** 每次命令执行后调用，刷新勾选状态 */
    evaluate(taskListEl) {
      const l = this.current;
      if (!l) return false;
      const items = (taskListEl || this.el.tasks).children;
      // 任务清单还没渲染出来时不能判"全部通过"，否则会误报通关并写脏进度
      if (!items.length) return false;
      let all = true;
      let matched = 0;
      l.tasks.forEach((t, i) => {
        let ok = false;
        try { ok = !!t.check(this.engine); } catch (e) { ok = false; }
        const li = items[i];
        if (li) {
          matched++;
          li.classList.toggle('ok', ok);
          const box = li.querySelector('.box');
          if (box) box.textContent = ok ? '☑' : '☐';
        }
        if (!ok) all = false;
      });
      if (matched < l.tasks.length) return false;
      if (this.el.allDone) this.el.allDone.style.display = all ? '' : 'none';
      if (all && this.progress.markDone(l.id)) {
        this.renderList();
        toast('✓ 「' + l.title + '」通关！', true);
      }
      return all;
    }
  }

  /* ---------------- 速查表 ---------------- */
  /**
   * groups: [{ title, rows: [[cmd, desc] | [bash, fish, desc]] , two: bool }]
   * 点击一行把命令填进输入框。
   */
  class CheatSheet {
    constructor(o) {
      this.bodyEl = typeof o.el === 'string' ? qs(o.el) : o.el;
      this.modalEl = typeof o.modal === 'string' ? qs(o.modal) : o.modal;
      this.inputEl = typeof o.input === 'string' ? qs(o.input) : o.input;
      this.groups = o.groups || [];
      this.render();
    }
    render() {
      if (!this.bodyEl) return;
      const box = this.bodyEl;
      box.innerHTML = '';
      this.groups.forEach((g) => {
        const wrap = h('div', 'cheat-group');
        wrap.appendChild(h('h4', null, g.title));
        if (g.two) {
          const head = h('div', 'cheat-head');
          head.appendChild(h('span', null, 'bash'));
          head.appendChild(h('span', null, 'fish'));
          head.appendChild(h('span', null, '说明'));
          wrap.appendChild(head);
        }
        g.rows.forEach((row) => {
          const isTwo = row.length === 3 && g.two;
          const r = h('div', 'cheat-row' + (isTwo ? ' two' : ''));
          const fill = isTwo ? row[1] : row[0];
          if (isTwo) {
            r.appendChild(h('code', null, row[0]));
            r.appendChild(h('code', 'fish', row[1]));
            r.appendChild(h('span', null, row[2]));
          } else {
            r.appendChild(h('code', null, row[0]));
            r.appendChild(h('span', null, row[1]));
          }
          r.addEventListener('click', () => {
            if (this.modalEl) this.modalEl.classList.remove('open');
            if (this.inputEl) {
              this.inputEl.value = fill;
              this.inputEl.focus();
              const n = fill.length;
              try { this.inputEl.setSelectionRange(n, n); } catch (e) {}
            }
            toast('已填入输入框：' + fill);
          });
          wrap.appendChild(r);
        });
        box.appendChild(wrap);
      });
    }
    open() { if (this.modalEl) this.modalEl.classList.add('open'); }
    close() { if (this.modalEl) this.modalEl.classList.remove('open'); }
  }


  /* ---------------- 文件编辑器 ---------------- */
  /**
   * git-learn 与 shell-learn 都要"编辑虚拟文件系统里的文件"，
   * 界面完全一样，只有"读写落到哪里"不同，所以用回调注入。
   *
   * opts: {
   *   modal, titleEl, nameEl, nameInputEl, areaEl, saveEl, cancelEl, noteEl, auxEl,
   *   defaultName, defaultContent,
   *   resolve(path) -> {abs} | {error}    把用户输入解析成绝对路径
   *   read(abs) -> string | null          null 表示文件不存在（走新建流程）
   *   write(abs, content, aux)            抛异常表示保存失败
   *   displayPath(abs) -> string
   *   onSaved(abs, aux)
   * }
   */
  class FileEditor {
    constructor(o) {
      this.o = o;
      const pick = (k) => (typeof o[k] === 'string' ? qs(o[k]) : o[k]);
      this.modal = pick('modal');
      this.titleEl = pick('titleEl');
      this.nameEl = pick('nameEl');
      this.nameInput = pick('nameInputEl');
      this.area = pick('areaEl');
      this.saveEl = pick('saveEl');
      this.cancelEl = pick('cancelEl');
      this.noteEl = pick('noteEl');
      this.auxEl = pick('auxEl');
      this.path = null;
      const self = this;
      if (this.saveEl) this.saveEl.addEventListener('click', () => self.save());
      if (this.cancelEl) this.cancelEl.addEventListener('click', () => self.close());
      if (this.modal) this.modal.addEventListener('click', (e) => { if (e.target === self.modal) self.close(); });
    }

    _absOf(p) {
      try {
        const r = this.o.resolve(p);
        return (r && r.abs) ? r.abs : null;
      } catch (e) { return null; }
    }

    open(path) {
      this.path = path || null;
      const abs = this.path ? this._absOf(this.path) : null;
      let content = null;
      if (abs) { try { content = this.o.read(abs); } catch (e) { content = null; } }
      const exists = content !== null && content !== undefined;

      if (this.titleEl) this.titleEl.textContent = exists ? '编辑文件' : '新建文件';
      if (this.nameEl) {
        this.nameEl.style.display = this.path ? '' : 'none';
        this.nameEl.textContent = (this.path && abs) ? (this.o.displayPath ? this.o.displayPath(abs) : abs) : '';
      }
      if (this.nameInput) {
        this.nameInput.style.display = this.path ? 'none' : '';
        this.nameInput.value = this.o.defaultName || 'new-file.txt';
      }
      if (this.area) this.area.value = exists ? content : (this.o.defaultContent || '');
      if (this.auxEl) this.auxEl.checked = false;
      if (this.noteEl) this.noteEl.textContent = this.o.note || '';
      if (this.modal) this.modal.classList.add('open');
      const target = (this.path && exists) ? this.area : this.nameInput;
      if (target) setTimeout(() => { try { target.focus(); } catch (e) {} }, 40);
    }

    close() { if (this.modal) this.modal.classList.remove('open'); }

    save() {
      const raw = this.path !== null ? this.path : (this.nameInput ? this.nameInput.value.trim() : '');
      if (!raw) { toast('请填文件名'); return; }
      const abs = this._absOf(raw);
      if (!abs) { toast('这个路径不允许写'); return; }
      const aux = this.auxEl ? !!this.auxEl.checked : false;
      try {
        this.o.write(abs, this.area ? this.area.value : '', aux);
      } catch (e) {
        toast('保存失败：' + ((e && e.message) ? e.message : e));
        return;
      }
      this.close();
      if (this.o.onSaved) this.o.onSaved(abs, aux);
    }
  }

  /* ---------------- 弹窗助手 ---------------- */
  const Modal = {
    open(sel) { const e = typeof sel === 'string' ? qs(sel) : sel; if (e) e.classList.add('open'); },
    close(sel) { const e = typeof sel === 'string' ? qs(sel) : sel; if (e) e.classList.remove('open'); },
    bindClose(sel, btnSel) {
      const e = typeof sel === 'string' ? qs(sel) : sel;
      if (!e) return;
      e.addEventListener('click', (ev) => { if (ev.target === e) e.classList.remove('open'); });
      if (btnSel) qsa(btnSel).forEach((b) => b.addEventListener('click', () => e.classList.remove('open')));
    },
  };

  global.TermKit = {
    qs, qsa, h, esc, dispWidth, truncate, sleep, toast, richText,
    Progress, Terminal, LessonPanel, CheatSheet, FileEditor, Modal,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = global.TermKit;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ============================================================
 * shell.js —— 迷你 shell 解释器
 * 虚拟文件系统 + 词法分析 + 展开 + 语法分析 + 执行。
 * 支持 bash 与 fish 两套语法，管道 / 重定向 / 变量 / 流程控制齐备。
 * 命令实现见 commands.js（通过 Shell.register 注册）。
 * ============================================================ */
(function (global) {
  'use strict';

  const USER = 'xinyan';
  const HOST = 'cachyos';
  const HOME = '/home/' + USER;

  /* ============================================================
   * 一、虚拟文件系统
   * ============================================================ */
  class FsError extends Error {
    constructor(code, path) { super(code); this.code = code; this.path = path; }
  }

  function mkDir(mode) { return { type: 'dir', mode: mode === undefined ? 0o755 : mode, children: Object.create(null) }; }
  function mkFile(content, mode) { return { type: 'file', mode: mode === undefined ? 0o644 : mode, content: content === undefined ? '' : content }; }
  function mkLink(target) { return { type: 'link', mode: 0o777, content: target }; }

  class VFS {
    constructor() { this.root = mkDir(); }

    /* ---- 路径 ---- */
    resolve(cwd, p) {
      p = String(p === undefined ? '' : p);
      if (p === '~') p = HOME;
      else if (p.indexOf('~/') === 0) p = HOME + p.slice(1);
      const parts = (p.indexOf('/') === 0) ? [] : cwd.split('/').filter(Boolean);
      p.split('/').forEach((seg) => {
        if (seg === '' || seg === '.') return;
        if (seg === '..') { parts.pop(); return; }
        parts.push(seg);
      });
      return '/' + parts.join('/');
    }

    /** 逐级查找；follow=false 时不跟随最后一段的符号链接 */
    _lookup(abs, follow) {
      const parts = abs.split('/').filter(Boolean);
      let node = this.root;
      let cur = '';
      for (let i = 0; i < parts.length; i++) {
        cur += '/' + parts[i];
        if (node.type !== 'dir') throw new FsError('ENOTDIR', cur);
        let child = node.children[parts[i]];
        if (!child) throw new FsError('ENOENT', cur);
        const isLast = (i === parts.length - 1);
        if (child.type === 'link' && (!isLast || follow !== false)) {
          child = this._lookup(this.resolve('/', child.content), true);
        }
        node = child;
      }
      return node;
    }

    exists(abs) { try { this._lookup(abs, true); return true; } catch (e) { return false; } }
    stat(abs) { return this._lookup(abs, true); }
    isDir(abs) { try { return this._lookup(abs, true).type === 'dir'; } catch (e) { return false; } }
    isLink(abs) { try { return this._lookup(abs, false).type === 'link'; } catch (e) { return false; } }

    _parent(abs) {
      const idx = abs.lastIndexOf('/');
      const dir = idx === 0 ? '/' : abs.slice(0, idx);
      const name = abs.slice(idx + 1);
      return { dir: this._lookup(dir, true), name: name, dirPath: dir };
    }

    mkdir(abs, parents) {
      const parts = abs.split('/').filter(Boolean);
      let node = this.root, cur = '';
      for (let i = 0; i < parts.length; i++) {
        cur += '/' + parts[i];
        const isLast = (i === parts.length - 1);
        let child = node.children[parts[i]];
        if (child) {
          if (child.type !== 'dir') throw new FsError('EEXIST', cur);
          if (isLast && !parents) throw new FsError('EEXIST', cur);
        } else {
          child = mkDir();
          node.children[parts[i]] = child;
        }
        node = child;
      }
    }

    /** list: [{name, type, size, mode, isLink}] */
    list(abs) {
      const node = this._lookup(abs, true);
      if (node.type !== 'dir') throw new FsError('ENOTDIR', abs);
      return Object.keys(node.children).map((name) => {
        const raw = node.children[name];
        let target = raw, followed = true;
        if (raw.type === 'link') {
          try { target = this._lookup(this.resolve(abs, raw.content), true); } catch (e) { followed = false; target = null; }
        }
        return {
          name: name,
          type: raw.type === 'link' ? (followed && target ? target.type : 'link') : raw.type,
          isLink: raw.type === 'link',
          linkTarget: raw.type === 'link' ? raw.content : null,
          size: !target ? 0 : (target.type === 'dir' ? 4096 : String(target.content).length),
          mode: raw.mode,
        };
      });
    }

    readFile(abs) {
      const node = this._lookup(abs, true);
      if (node.type === 'dir') throw new FsError('EISDIR', abs);
      if ((node.mode & 0o444) === 0) throw new FsError('EACCES', abs);
      return node.content;
    }

    writeFile(abs, content, append) {
      const par = this._parent(abs);
      if (par.dir.type !== 'dir') throw new FsError('ENOTDIR', par.dirPath);
      let node = par.dir.children[par.name];
      if (node && node.type === 'dir') throw new FsError('EISDIR', abs);
      if (node && (node.mode & 0o222) === 0) throw new FsError('EACCES', abs);
      if (!node) { node = mkFile(''); par.dir.children[par.name] = node; }
      node.content = append ? (node.content + content) : content;
      return node;
    }

    createFile(abs) {
      const par = this._parent(abs);
      if (par.dir.children[par.name]) return;
      par.dir.children[par.name] = mkFile('');
    }

    remove(abs) {
      const par = this._parent(abs);
      const node = par.dir.children[par.name];
      if (!node) throw new FsError('ENOENT', abs);
      if (node.type === 'dir' && Object.keys(node.children).length) throw new FsError('ENOTEMPTY', abs);
      delete par.dir.children[par.name];
      return node;
    }

    /** 递归删除，返回文件数 */
    removeRecursive(abs) {
      const node = this._lookup(abs, false);
      let n = 0;
      if (node.type === 'dir') {
        Object.keys(node.children).forEach((k) => { n += this.removeRecursive(abs + '/' + k); });
      } else n = 1;
      const par = this._parent(abs);
      delete par.dir.children[par.name];
      return n;
    }

    copyInto(srcAbs, dstAbs, recursive) {
      const src = this._lookup(srcAbs, false);
      if (src.type === 'dir' && !recursive) throw new FsError('EISDIR', srcAbs);
      const par = this._parent(dstAbs);
      if (par.dir.children[par.name] && par.dir.children[par.name].type === 'dir') {
        // 目标是目录，复制进去
        const inner = par.dir.children[par.name];
        const base = srcAbs.split('/').filter(Boolean).pop();
        inner.children[base] = this._clone(src);
        return;
      }
      par.dir.children[par.name] = this._clone(src);
    }

    _clone(node) {
      if (node.type === 'dir') {
        const d = mkDir(node.mode);
        Object.keys(node.children).forEach((k) => { d.children[k] = this._clone(node.children[k]); });
        return d;
      }
      return node.type === 'link' ? mkLink(node.content) : mkFile(node.content, node.mode);
    }

    move(srcAbs, dstAbs) {
      const par = this._parent(dstAbs);
      if (par.dir.children[par.name] && par.dir.children[par.name].type === 'dir') {
        const base = srcAbs.split('/').filter(Boolean).pop();
        dstAbs = dstAbs.replace(/\/$/, '') + '/' + base;
      }
      const sp = this._parent(srcAbs);
      const node = sp.dir.children[sp.name];
      if (!node) throw new FsError('ENOENT', srcAbs);
      const dp = this._parent(dstAbs);
      if (dp.dir.children[dp.name]) throw new FsError('EEXIST', dstAbs);
      delete sp.dir.children[sp.name];
      dp.dir.children[dp.name] = node;
    }

    chmod(abs, mode) {
      const node = this._lookup(abs, false);
      node.mode = mode;
    }

    /* 目录树（给右侧面板用） */
    tree(abs, depth, maxDepth) {
      const node = this._lookup(abs, true);
      const out = [];
      const walk = (n, path, d) => {
        if (d > (maxDepth === undefined ? 4 : maxDepth)) return;
        Object.keys(n.children).sort().forEach((name) => {
          const child = n.children[name];
          const p = path + '/' + name;
          out.push({ path: p, name: name, type: child.type, depth: d, size: child.type === 'dir' ? 0 : String(child.content).length });
          if (child.type === 'dir') walk(child, p, d + 1);
        });
      };
      walk(node, abs === '/' ? '' : abs, 1);
      return out;
    }
  }
